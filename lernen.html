<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lernplaner">
<meta name="theme-color" content="#14323C">
<link rel="manifest" href="lernen.webmanifest">
<link rel="apple-touch-icon" href="icons/lernen-180.png">
<script src="js/config.js"></script>
<title>Lernplaner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Lernplaner. Gleiche Grundlage wie der Familienplan: Wand (Grau), Blatt (Weiß), Tinte (Petrol).
   Einziger Blickfang ist die Spielstand-Tafel. Die Trikotfarbe (--fill) erscheint nur auf Hauptknöpfen und in der Tafel. */
:root{--wand:#E7EDEF;--blatt:#fff;--tinte:#14323C;--tinte2:#4F6972;--linie:#D5DFE2;--leise:#F2F5F6;--tafel:#14323C;
  --ok:#2E7D55;--okbg:#E3F1E9;--wa:#8A5A00;--wabg:#FBF0D6;--er:#C42B24;--erbg:#FBE7E5;--ac:#1E5F74;--acbg:#E1EEF2;
  --fill:#F5C400;--on:#14323C;--stripe:#14323C;--anz:'Barlow Condensed','Arial Narrow',sans-serif;--text:'Barlow','Helvetica Neue',Arial,sans-serif}
@media (prefers-color-scheme:dark){:root{--wand:#0E1A1F;--blatt:#172930;--tinte:#E2EBED;--tinte2:#9AB0B7;--linie:#2B4048;--leise:#1D333B;--tafel:#0A1418;
  --ok:#7CC79C;--okbg:#173A29;--wa:#F0C46A;--wabg:#3A2C0C;--er:#F08A84;--erbg:#3F1B19;--ac:#8CC6D6;--acbg:#16343E}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--wand);color:var(--tinte);font:16px/1.45 var(--text)}
a{color:inherit}
header{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 4px;display:flex;justify-content:space-between;align-items:flex-end}
.brand{font:700 26px/1 var(--anz);letter-spacing:.01em}
.hdr-sub{font-size:14px;color:var(--tinte2);margin-top:4px}
.hdr-r{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--tinte2)}
.hdr-r a{text-decoration:none;border:1px solid var(--linie);border-radius:999px;padding:4px 12px;background:var(--blatt)}
main{max-width:560px;margin:0 auto;padding:6px 14px calc(92px + env(safe-area-inset-bottom,0px))}
/* Leiste unten wie im Familienplan */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--blatt);border-top:1px solid var(--linie);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs .in{display:flex;width:100%;max-width:560px}
.tab{flex:1;border:0;background:none;font:500 12px/1.2 var(--text);color:var(--tinte2);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;cursor:pointer;border-radius:10px}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--tinte);font-weight:600}
.tab.on svg{stroke-width:2.2}
.tab.on .pip{background:var(--fill)}
.pip{width:18px;height:3px;border-radius:2px;background:transparent;margin-top:1px}
.sync{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--linie)}
.sync.ok{background:var(--ok)}.sync.err{background:var(--er)}
h1{font:700 24px/1.1 var(--anz);margin:0}
h2{font:700 20px/1.15 var(--anz);margin:0 0 8px;letter-spacing:.01em}
h3{font:600 15px/1.3 var(--text);margin:0 0 2px}
.sub{color:var(--tinte2);font-size:14px}
.muted{color:var(--tinte2)}
.big{font:700 26px/1.1 var(--anz)}
/* Blätter */
.card{background:var(--blatt);border-radius:14px;padding:16px;margin:12px 0;border:1px solid var(--linie)}
.grp{border-top:1px solid var(--linie);margin-top:18px;padding-top:14px}
.li{display:flex;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--linie);font-size:15px;flex-wrap:wrap}
h2+.li,.sub+.li,.card>.li:first-child{border-top:0}
.grow{flex:1;min-width:0}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;flex-shrink:0}
/* Spielstand-Tafel: der eine Blickfang */
.board{background:var(--tafel);color:#fff;border-radius:18px;padding:16px 18px 18px;margin:12px 0}
.board .b-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.board .b-lab{font-size:13px;color:#A9C2C9}
.board .b-num{font:700 64px/0.9 var(--anz);color:#fff;margin-top:4px}
.board .b-liga{text-align:right}
.board .b-ligan{font:700 22px/1.1 var(--anz);color:var(--hl,var(--fill))}
.board .b-week{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:16px}
.board .b-week div{text-align:center;border-radius:8px;padding:6px 0 5px;background:rgba(255,255,255,.07);font:600 13px/1.2 var(--text);color:#A9C2C9}
.board .b-week div b{display:block;font:700 15px/1.2 var(--anz);color:#fff;margin-top:2px}
.board .b-week .won{background:var(--fill);color:var(--on)}
.board .b-week .won b{color:var(--on)}
.board .b-week .now{box-shadow:inset 0 0 0 2px rgba(255,255,255,.55)}
.board .b-week .lost b{color:#F08A84}
.board .b-prize{font-size:14px;color:#D6E3E7;margin-top:12px}
.board .btn.primary{width:100%;margin-top:14px;font:700 22px/1 var(--anz);padding:14px;letter-spacing:.02em}
.board .b-hint{font-size:13px;color:#A9C2C9;text-align:center;margin-top:8px}
/* Jetzt dran */
.focus{border-left:6px solid var(--c);padding-left:16px}
.focus .label{font:600 14px/1 var(--text);color:var(--tinte2)}
.focus .ft{font:700 26px/1.1 var(--anz);margin:8px 0 4px}
.meta{font-size:14px;color:var(--tinte2)}
.time{font-size:14px;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:13px;padding:3px 10px;border-radius:999px;background:var(--leise);color:var(--tinte2);display:inline-block}
.chip.wa{background:var(--wabg);color:var(--wa)}.chip.ok{background:var(--okbg);color:var(--ok)}.chip.er{background:var(--erbg);color:var(--er)}
/* Tagesplan */
.days{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px}
.day{flex:0 0 auto;border:1px solid var(--linie);background:var(--blatt);border-radius:10px;padding:6px 10px;font:600 14px/1.25 var(--text);color:var(--tinte);text-align:center;cursor:pointer;min-width:56px}
.day.on{background:var(--tinte);color:var(--blatt);border-color:var(--tinte)}
.day small{display:block;font-size:12px;font-weight:400;opacity:.8}
.item{display:flex;gap:12px;align-items:flex-start;background:var(--blatt);border:1px solid var(--linie);border-left:5px solid var(--c,var(--linie));border-radius:12px;padding:12px;margin:8px 0}
.neue-version{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--tinte);color:#fff;border:0;border-radius:999px;padding:12px 20px;font:600 15px/1.2 var(--text);box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:calc(100vw - 32px)}
.li.stk{flex-wrap:wrap;row-gap:8px}
.li.stk .grow{flex:1 1 calc(100% - 24px);min-width:0}
.li.stk .acts{display:flex;flex-wrap:wrap;gap:6px;width:100%;padding-left:20px}
.item.brk{background:transparent;border-style:dashed;border-left:5px solid var(--linie);padding:8px 12px}
.item.brk .tt{font-size:15px}
.item.appt{background:var(--leise);border-left-color:var(--tinte2)}
.tt{font-weight:600}
.chk{width:30px;height:30px;border-radius:8px;border:2px solid var(--linie);background:var(--blatt);flex-shrink:0;cursor:pointer}
/* Knöpfe */
button{font:inherit;cursor:pointer;color:inherit}
.btn{border:1px solid var(--linie);background:var(--blatt);color:var(--tinte);border-radius:10px;padding:8px 14px;font:500 15px/1.2 var(--text);text-decoration:none;display:inline-block}
.btn.sm{padding:5px 10px;font-size:14px}
.btn.primary{background:var(--fill);border-color:var(--fill);color:var(--on);font-weight:600}
.btn.big{font-size:18px;padding:12px 18px}
.btn.on{background:var(--tinte);border-color:var(--tinte);color:var(--blatt)}
.btn.danger{color:var(--er)}
.btn.ghost{border-color:transparent;background:none;color:var(--tinte2);padding-left:0}
.btn:focus-visible,.tab:focus-visible,.seg button:focus-visible,.day:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.more{display:flex;flex-wrap:wrap;gap:4px 18px;margin:18px 2px 0}
.more .btn{padding:6px 0;border:0;background:none;color:var(--tinte2);text-decoration:underline;text-underline-offset:3px}
.fb{margin-top:14px;padding-top:12px;border-top:1px solid var(--linie)}
.fb .q{font-size:15px;margin:8px 0 6px}
/* Formulare */
label{display:block;font-size:14px;color:var(--tinte2);margin:10px 0 0}
input,select,textarea{display:block;width:100%;max-width:100%;min-width:0;font:16px/1.3 var(--text);padding:9px 11px;margin-top:4px;border:1px solid var(--linie);border-radius:10px;background:var(--blatt);color:var(--tinte)}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;min-height:42px;text-align:left}
input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value{text-align:left}
input[type=checkbox]{display:inline;width:auto;min-height:0;margin:0 8px 0 0;accent-color:var(--tinte)}
label:has(>input[type=checkbox]){color:var(--tinte);font-size:15px;display:flex;align-items:center}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.g5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.g2>label,.g5>label{min-width:0}
@media (max-width:480px){.g2{grid-template-columns:minmax(0,1fr);gap:0}.g5{grid-template-columns:repeat(3,minmax(0,1fr))}}
/* Hinweise */
.note{font-size:14px;padding:10px 12px;border-radius:10px;background:var(--acbg);color:var(--ac);margin:10px 0}
.warn{background:var(--wabg);color:var(--wa)}.err{background:var(--erbg);color:var(--er)}.okn{background:var(--okbg);color:var(--ok)}
/* Elternbereich: Umschalter */
.seg{display:flex;gap:4px;background:var(--blatt);border:1px solid var(--linie);border-radius:12px;padding:4px;margin:12px 0 4px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:9px 2px;font:500 14px/1.1 var(--text);color:var(--tinte2)}
.seg button.on{background:var(--tinte);color:var(--blatt);font-weight:600}
.seg .cnt{display:inline-block;min-width:18px;padding:1px 5px;border-radius:9px;background:var(--er);color:#fff;font-size:11px;font-weight:600;margin-left:2px}
details.card summary{cursor:pointer;list-style:none}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:'›';float:right;font-size:22px;line-height:20px;color:var(--tinte2);transition:transform .2s}
details.card[open] summary::after{transform:rotate(90deg)}
details.card[open] summary{margin-bottom:8px}
/* Einstellungen als Zeilen */
.sh{margin:18px 0 2px;color:var(--tinte2);font-size:14px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0;padding:10px 0;border-top:1px solid var(--linie);color:var(--tinte);font-size:15px}
.sh+.srow{border-top:0}
.srow>span:first-child{flex:1;min-width:0}
.srow small{display:block;font-size:13px;color:var(--tinte2);margin-top:2px}
.srow .iv{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.srow .iv input,.srow .iv select{width:96px;margin:0;padding:7px 9px;text-align:right}
.srow .iv input[type=time]{width:116px}
.srow .iv em{font-style:normal;font-size:14px;color:var(--tinte2);min-width:30px}
.srow.col{flex-direction:column;align-items:stretch;gap:6px}
.srow.col input,.srow.col select{margin:0}
input.tg{-webkit-appearance:none;appearance:none;width:46px;height:28px;border-radius:14px;background:var(--linie);position:relative;flex:0 0 auto;margin:0;cursor:pointer;transition:background .15s}
input.tg::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s}
input.tg:checked{background:var(--ok)}
input.tg:checked::after{left:21px}
input.tg:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
/* Kennzahlen */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:4px 0 2px}
.stats .v{font:700 34px/1 var(--anz)}
.stats .v small{font:600 16px var(--text);color:var(--tinte2)}
.stats .sub{margin-top:4px;font-size:13px}
/* Stundenplan */
.days5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:6px 0 10px}
.days5.wd7{grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dchk{position:relative;display:block;margin:0;min-width:0;width:100%}
.dchk input{position:absolute;opacity:0;width:1px!important;height:1px;padding:0;border:0;margin:0}
.dchk span{display:block;width:100%;box-sizing:border-box;text-align:center;padding:9px 0;border:1px solid var(--linie);border-radius:10px;font-weight:600;color:var(--tinte);background:var(--blatt)}
.dchk input:checked+span{background:var(--tafel);color:#fff;border-color:var(--tafel)}
.dchk input:focus-visible+span{outline:2px solid var(--tinte);outline-offset:2px}
.days5 .day{min-width:0;padding:7px 2px}
.ttrow{display:grid;grid-template-columns:22px 48px minmax(0,1fr);gap:8px;align-items:center;padding:4px 0}
.ttrow .n{font:700 17px/1 var(--anz);text-align:right}
.ttrow .tm{font-size:13px;color:var(--tinte2)}
.ttrow select{margin:0;padding:7px 10px;color:var(--tinte2)}
.ttrow select.set{color:var(--tinte);font-weight:500;background:var(--leise)}
.ttimes{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr);gap:6px 10px;align-items:center;margin-top:10px}
.ttimes input{margin:0}
details.grp summary{cursor:pointer;list-style:none}
details.grp summary::-webkit-details-marker{display:none}
details.grp summary::after{content:'›';float:right;font-size:22px;line-height:20px;color:var(--tinte2);transition:transform .2s}
details.grp[open] summary::after{transform:rotate(90deg)}
details.grp[open] summary{margin-bottom:6px}
/* Woche */
.bar{height:6px;background:var(--leise);border-radius:3px;overflow:hidden;margin:8px 0 4px}
.bar div{height:100%;background:var(--tinte2)}
.bar div.full{background:var(--wa)}
.prog{height:6px;background:var(--leise);border-radius:3px;overflow:hidden;margin:6px 0 2px}
.prog div{height:100%;background:var(--ok)}
/* Pokale */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.badge{border:1px solid var(--linie);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--tinte2);overflow-wrap:break-word;min-width:0}
.badge.off{color:var(--tinte2)}
.badge.off b{color:var(--tinte2)}
.badge .bdone{display:inline-block;margin-top:6px;font-size:12px;font-weight:600;color:var(--tinte);background:var(--leise);border-radius:999px;padding:2px 8px}
.badge .bprog{display:block;height:5px;border-radius:3px;background:var(--leise);margin-top:8px;overflow:hidden}
.badge .bprog i{display:block;height:100%;background:var(--tinte)}
.badge .bcnt{display:block;font-size:12px;margin-top:3px}
.quiz{margin-top:12px;border-top:1px dashed var(--linie);padding-top:10px}
.quiz .qh{font-size:13px;color:var(--tinte2);font-weight:600}
.quiz .qq{font:700 20px/1.25 var(--anz);margin:4px 0 8px}
.quiz .qa{background:var(--leise);border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:16px}
.qdet{margin:0 0 8px 20px}.qdet summary{font-size:14px;color:var(--tinte2);cursor:pointer}
.tafel{display:block;width:100%;background:var(--court) center/100% 100% no-repeat,var(--tafel);background-blend-mode:normal;color:#fff;border:0;border-radius:16px;padding:12px 16px 12px;margin:10px 0 4px;text-align:left;font:inherit;cursor:pointer;position:relative;overflow:hidden}
.tafel::before{content:"";position:absolute;inset:0;background:var(--tafel);opacity:.86;pointer-events:none}
.tafel>*{position:relative}
.t-row{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px}
.t-team{display:flex;flex-direction:column;min-width:0}
.t-team.r{align-items:flex-end;text-align:right}
.t-team.r .t-name{justify-content:flex-end}
.t-side{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#8FB0B8}
.t-name{display:flex;align-items:center;gap:6px;font:700 16px/1.15 var(--anz);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-kit svg{width:20px;height:26px;display:block}
.t-score{display:flex;align-items:center;gap:4px;font:700 44px/1 var(--anz);font-variant-numeric:tabular-nums}
.t-score b{min-width:.62em;text-align:center;background:rgba(0,0,0,.28);border-radius:8px;padding:2px 6px}
.t-score i{font-style:normal;color:#8FB0B8;font-size:34px}
.t-row2{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13px;color:#A9C2C9}
.t-state{flex:1}
.t-more{text-decoration:underline;text-underline-offset:3px}
.t-rule{font-size:13px;color:var(--tinte2);margin:0 6px 6px}
.bericht .sb-row{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-top:1px solid var(--linie);font-size:15px}
.bericht .k-lab+.sb-row{border-top:0}
.sb-t{color:var(--tinte2);font-size:13px;width:3em;flex:none}
.sb-s{font:700 16px/1 var(--anz);width:2.6em;flex:none;font-variant-numeric:tabular-nums}
.sb-row.opp{color:var(--tinte2)}
.sb-rules{margin-top:12px;padding-top:10px;border-top:1px dashed var(--linie);display:grid;gap:6px;font-size:14px;color:var(--tinte2)}
.sb-rules b{color:var(--tinte)}
.introk{border:2px solid var(--fill)}
.intro-l{margin:0;padding-left:20px;display:grid;gap:8px;font-size:15px;line-height:1.4}
.chances{display:grid;gap:8px;margin:14px 0 2px;font-size:14px;color:var(--tinte2)}
.chances div{display:flex;gap:10px;align-items:flex-start}
.ball{flex:none;width:16px;height:16px;border-radius:50%;margin-top:1px;background:radial-gradient(circle at 35% 35%,#fff 0 18%,transparent 19%),var(--fill);box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.25)}
.ball.opp{background:var(--linie)}
.pips{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.pips i{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.16)}
.pips i.on{background:var(--fill)}
.pbar{display:block;width:100%;max-width:180px;height:8px;border-radius:4px;background:rgba(255,255,255,.16);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--fill)}
.lmline{font-size:13px;color:var(--tinte2);margin:0 4px 4px}
.k-lab,.j-top{font-size:14px;font-weight:600;color:var(--tinte2)}
.k-big{font:700 26px/1.1 var(--anz);margin:6px 0 12px}
.k-list{list-style:none;padding:0;margin:0}
.k-list li{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--linie);font-size:15px}
.k-list li:first-child{border-top:0}
.n-min{color:var(--tinte2);font-size:14px;white-space:nowrap}
.n-more{color:var(--tinte2);font-size:14px}
.jetzt,.kickk,.pausek,.endk{padding:20px 18px}
.j-top{display:flex;align-items:center;gap:8px}
.j-top .j-time{margin-left:auto;font-weight:500}
.jetzt .ft{font:700 30px/1.08 var(--anz);margin:10px 0 6px}
.jetzt .meta{color:var(--tinte2);font-size:15px}
.act{margin-top:18px;display:flex;flex-direction:column;align-items:stretch;gap:4px}
.btn.xl{font:700 22px/1 var(--anz);padding:16px;letter-spacing:.02em;text-align:center;border-radius:12px}
.lnk{background:none;border:0;color:var(--tinte2);font:500 15px/1.3 var(--text);text-decoration:underline;text-underline-offset:3px;padding:8px 0;cursor:pointer}
.act .lnk{align-self:center}

<script>
/* ===== Konfiguration: kommt aus js/config.js der Familien-App ===== */
const FCFG=window.ESSENSPLAN_CONFIG||{};
const REMOTE=!!(FCFG.supabaseUrl&&FCFG.supabaseKey);
let sb=null,authOk=true,kids=[],persons=[],accessToken='';
const CACHE_KEY=REMOTE?'lernplaner-web-v1':'lernplaner-v1';

const SUBJ=['Mathe','Deutsch','Englisch','Latein','Biologie','Physik','Natur und Technik','Geschichte','Geographie','Wirtschaft','Religion/Ethik','Musik','Kunst','Sonstiges'];
const COL={Mathe:'#378ADD',Deutsch:'#D85A30',Englisch:'#1D9E75',Latein:'#7F77DD',Biologie:'#639922',Physik:'#BA7517','Natur und Technik':'#97C459',Geschichte:'#993C1D',Geographie:'#0F6E56',Wirtschaft:'#5F5E5A','Religion/Ethik':'#534AB7',Musik:'#D4537E',Kunst:'#ED93B1',Sonstiges:'#888780'};

const EXAM={'Schulaufgabe':[[-8,30],[-6,30],[-4,30],[-3,30],[-2,35],[-1,20]],'Kurzarbeit':[[-4,20],[-2,25],[-1,15]],'Ex / Test':[[-3,20],[-2,20],[-1,15]],'Referat':[[-10,30],[-7,30],[-4,30],[-2,30],[-1,20]]};
// Rund 5 Tore pro Schultag: Bundesliga nach etwa 14 Wochen, Europapokal nach etwa 18.
const LIGA=[['Kreisliga',0],['Bezirksliga',20],['Bezirksoberliga',50],['Landesliga',90],['Bayernliga',140],['3. Liga',200],['2. Bundesliga',270],['1. Bundesliga',350],['Europapokal',450]];
// Trikots: Shirt, Kragen und Ärmelränder, Hose. Coburg gelb-schwarz (Vereinsfarben), Kiel weiß mit schwarzen Streifen („Zebras“).
const THEMES=[
  {n:'Coburg',d:'Heim',m:'#F5C400',on:'#111111',s:'#111111',shirt:'#F5C400',trim:'#111111',shorts:'#111111',lvl:0},
  {n:'Blau',d:'',m:'#1E5FA8',on:'#ffffff',s:'#ffffff',shirt:'#1E5FA8',trim:'#ffffff',shorts:'#ffffff',lvl:1},

  {n:'Orange',d:'',m:'#D9621C',on:'#ffffff',s:'#1A1A1A',shirt:'#D9621C',trim:'#1A1A1A',shorts:'#1A1A1A',lvl:4},
  {n:'Coburg',d:'Auswärts',m:'#1A1A1A',on:'#F5C400',s:'#F5C400',shirt:'#1A1A1A',trim:'#F5C400',shorts:'#1A1A1A',lvl:5},
  {n:'Lila',d:'',m:'#6A3FB5',on:'#ffffff',s:'#ffffff',shirt:'#6A3FB5',trim:'#ffffff',shorts:'#ffffff',lvl:6},
  {n:'Kiel',d:'Zebra',m:'#1A1A1A',on:'#ffffff',s:'#ffffff',shirt:'#ffffff',trim:'#1A1A1A',shorts:'#1A1A1A',stripes:'#1A1A1A',lvl:7},
  {n:'Kiel',d:'Champions League',m:'#B08A2E',on:'#ffffff',s:'#1A1A1A',shirt:'#ffffff',trim:'#B08A2E',shorts:'#ffffff',band:'#B08A2E',diag:'#C8A45A',chest:'#1A1A1A',lvl:8}];
function kitSvg(th,i){
  const shirt='M21 6 L27 3 Q32 8 37 3 L43 6 L57 14 L52 26 L45 23 L45 48 L19 48 L19 23 L12 26 L7 14 Z';
  const diag=th.diag?`<g clip-path="url(#kc${i})" stroke="${th.diag}" stroke-width=".6">${[-26,-19,-12,-5,2,9,16,23,30,37,44,51].map(x=>`<line x1="${x}" y1="50" x2="${x+34}" y2="0"/>`).join('')}</g>`:'';
  const chest=th.chest?`<g clip-path="url(#kc${i})"><rect x="19" y="15" width="26" height="7" fill="${th.chest}"/><path d="M19 15 H45 M19 22 H45" stroke="${th.trim}" stroke-width=".9"/></g>`:'';
  const t2=th.trim2?`<path d="M27.6 3.6 Q32 7.6 36.4 3.6" fill="none" stroke="${th.trim2}" stroke-width=".9"/><path d="M8.2 15.2 L12.4 25 M55.8 15.2 L51.6 25" stroke="${th.trim2}" stroke-width=".9"/>`:'';
  const stripes=th.stripes?`<g clip-path="url(#kc${i})">${[22,29,36,43].map(x=>`<rect x="${x}" y="0" width="3.5" height="50" fill="${th.stripes}"/>`).join('')}</g>`:'';
  return `<svg viewBox="0 0 64 82" aria-hidden="true"><defs><clipPath id="kc${i}"><path d="${shirt}"/></clipPath></defs>
  <path d="${shirt}" fill="${th.shirt}" stroke="rgba(0,0,0,.25)" stroke-width="1"/>${stripes}${diag}${chest}
  <path d="M27 3 Q32 8 37 3" fill="none" stroke="${th.trim}" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M7 14 L12 26 M57 14 L52 26" stroke="${th.trim}" stroke-width="2.5" stroke-linecap="round"/>${t2}
  <path d="M19 52 L45 52 L47 78 L35 78 L32 64 L29 78 L17 78 Z" fill="${th.shorts}" stroke="rgba(0,0,0,.25)" stroke-width="1"/>
  <path d="M19 55 L45 55" stroke="${th.band||(th.shirt==='#ffffff'?th.trim:th.shirt)}" stroke-width="1.5" opacity=".9"/></svg>`;
}
// Jede Sache ist genau ein Tor. Der Tagessieg zählt im Wochenspiel, nicht als Tore.
// Pausen ohne Bildschirm, mit Bewegung: aktive Pausen verbessern nachweislich die Aufmerksamkeit danach.
const BREAK_SHORT=['3 Minuten aufs Trampolin','20 Hampelmänner, dann ein Glas Wasser','10 Würfe mit dem Ball gegen die Wand','Ans offene Fenster, tief durchatmen, Schultern kreisen','Auf einem Bein stehen, 30 Sekunden pro Seite','Einmal ums Haus gehen'];
const BREAK_LONG=['10 Minuten aufs Trampolin','Raus in den Garten: Ball prellen und auf ein Ziel werfen','Obst oder Nüsse essen und Wasser trinken','Kurzer Gang an der frischen Luft'];
function breakIdea(long,seed){const own=String(S.settings.breakIdeas||'').split('\n').map(x=>x.trim()).filter(Boolean);
  const list=(long?BREAK_LONG:BREAK_SHORT).concat(own);let h=0;String(seed).split('').forEach(c=>h=(h*31+c.charCodeAt(0))>>>0);return list[h%list.length]}
const PTS={task:1,check:1,kick:1,review:1,meet:1};
const CHECKS=[['latein','Latein'],['englisch','Englisch']];

const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const toMin=s=>{const[h,m]=String(s).split(':').map(Number);return h*60+(m||0)};
const hm=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const r5=m=>Math.max(5,Math.round(m/5)*5);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>{const d=parse(s);return WD[d.getDay()]+', '+d.getDate()+'.'+(d.getMonth()+1)+'.'};
const diff=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const col=s=>COL[s]||'#888780';
const nowMin=()=>{const n=new Date();return n.getHours()*60+n.getMinutes()};
const isWeekday=d=>d.getDay()>=1&&d.getDay()<=5;
function schoolDayIn(n){let d=addDays(today(),n);while(!isWeekday(d))d=addDays(d,1);return iso(d)}
function monday(d){const x=new Date(d);return addDays(x,-((x.getDay()+6)%7))}

let S,ui={tab:'heute',day:0,fb:null,fbDur:'ok',fbFeel:'mittel',unlocked:false,addHA:false,msg:'',msgType:'',scanOpen:false,scan:{status:'idle'},focus:null,full:false,edit:null,busy:null,rv:{},sync:REMOTE?'':'local'};

/* ===== Claude ===== */
let SAMPLE=null;
// Ferien und Feiertage aus dem Familienplan (js/logic.js). Fehlt die Datei, gelten nur die Wochenenden.
let CAL=null;
try{import('./js/logic.js').then(m=>{CAL=m;if(S)render()}).catch(()=>{})}catch(e){}
function freeReason(d){if(!isWeekday(d))return null;try{return CAL?CAL.schoolFree(iso(d)):null}catch(e){return null}}
if(!REMOTE){try{if(window.claude&&window.claude.use)window.claude.use('sample').then(s=>{SAMPLE=s;render()}).catch(()=>{})}catch(e){}}
const AI_OK=()=>(REMOTE&&authOk&&!!sb)||!!SAMPLE;
function blobToB64(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res({type:b.type||'image/jpeg',data:String(r.result).split(',')[1]});r.onerror=rej;r.readAsDataURL(b)})}
function parseJSON(t){if(t&&typeof t==='object')return t;const s=String(t||''),a=s.indexOf('{'),b=s.lastIndexOf('}');if(a<0||b<a)throw{code:'parse'};return JSON.parse(s.slice(a,b+1))}
async function aiText(prompt,images,opt){
  images=images||[];opt=opt||{};
  if(REMOTE){
    const imgs=await Promise.all(images.map(blobToB64));
    const{data,error}=await sb.functions.invoke('lernplaner',{body:{prompt,images:imgs,web:!!opt.web}});
    if(error){const st=error.context&&error.context.status;let msg='';try{const j=await error.context.json();msg=(j&&j.error)||''}catch(e){}
      throw{code:st===429?'rate_limited':'error',msg:msg||(st?'Status '+st:String(error.message||''))}}
    return(data&&data.text)||'';
  }
  if(!SAMPLE)throw{code:'not_granted'};
  const res=await SAMPLE(prompt,images.length?{images,modelTier:'default'}:{modelTier:'default'});
  return res.text||'';
}
async function aiJSON(prompt,images,opt){
  if(!REMOTE&&SAMPLE&&SAMPLE.json)return SAMPLE.json(prompt,(images&&images.length)?{images,modelTier:'default'}:{modelTier:'default'});
  return parseJSON(await aiText(prompt,images,opt));
}
function aiError(e){
  const c=e&&e.code;
  if(c==='not_granted'){SAMPLE=null;return'Claude ist hier nicht verfügbar.'}
  if(c==='rate_limited')return'Gerade zu viele Anfragen. Bitte in ein paar Minuten noch einmal versuchen.';
  if(c==='parse')return'Claude hat keine verwertbare Antwort geliefert. Bitte noch einmal versuchen.';
  return'Das hat nicht geklappt. Bitte noch einmal versuchen.'+(e&&e.msg?' Grund: '+String(e.msg).slice(0,160):'');
}

/* ===== Datenmodell ===== */
const ARR={tasks:'task',exams:'exam',appts:'appt',oneoffs:'oneoff',goals:'goal',conc:'conc',help:'help',books:'book',results:'result',lessons:'lesson'};
const MAP={wins:'win',kick:'kick',checks:'check',prizes:'prize',days:'day',meets:'meet'};
const ONE=['settings','pace','schoolEnd','running','meta','model','report','timetable','lm','brk'];
function blank(){return{settings:{},pace:{},schoolEnd:{},timetable:null,running:null,meta:{},model:{},report:null,tasks:[],exams:[],appts:[],oneoffs:[],goals:[],help:[],books:[],results:[],lessons:[],conc:[],lm:null,brk:null,wins:{},kick:{},checks:{},prizes:{},days:{},meets:{}}}
function migrate(x){
  const b=blank();
  Object.keys(b).forEach(k=>{if(x[k]===undefined||x[k]===null&&k!=='running'&&k!=='report')x[k]=b[k]});
  if(x.v===1||x.v===2){ // alter Prototyp
    if(x.sample!==undefined)x.meta.sample=x.sample;
    x.tasks.forEach(t=>{if(t.kind==='lern')t.title=String(t.title).replace(/^(Lernen|Wiederholen): /,'')});
    x.goals.forEach(g=>{if(!g.id)g.id=uid()});
    delete x.v;delete x.sample;
  }
  x.settings=Object.assign({pin:'1234',afterSchool:60,latest:'19:30',weekendStart:'10:00',buffer:30,blockMax:20,pause:5,longAfter:40,longPause:15,breakIdeas:'',grade:7,focusMode:true,awayAlert:5,quizOn:true,sundayFree:true,ludusOn:true,ludusMin:15,ludusUrl:'',checksOn:true,winGoal:4,bedtimeMin:30,theme:0},x.settings);
  if(typeof x.settings.theme!=='number')x.settings.theme=0;
  x.schoolEnd=Object.assign({1:'13:00',2:'15:30',3:'13:00',4:'13:00',5:'12:15'},x.schoolEnd);
  x.model=Object.assign({cap:60,prep:{}},x.model);
  // Ab Version 2: Richtwert 60 Min. an Schultagen, höchstens 75 (Studienlage für 12- bis 14-Jährige).
  if(!x.model.capV){x.model.cap=Math.min(+x.model.cap||60,60);x.model.capV=2}
  if(x.settings.longAfter===undefined){x.settings.longAfter=40;x.settings.longPause=15}
  if(x.settings.holidaysFree===undefined)x.settings.holidaysFree=true;
  return x;
}
function defaults(){
  const s=migrate(blank());
  s.appts=[{id:uid(),title:'Handballtraining',weekday:2,start:'17:00',end:'18:30'},{id:uid(),title:'Handballtraining',weekday:4,start:'17:00',end:'18:30'}];
  s.meta={setup:false};
  return s;
}
function seed(){
  S=defaults();S.meta={sample:true,setup:false};
  addHA('Mathe','Buch S. 88 Nr. 3 und 4',schoolDayIn(1),20);
  addHA('Englisch','Workbook S. 42',schoolDayIn(1),15);
  addHA('Deutsch','Inhaltsangabe zu Ende schreiben',schoolDayIn(3),30);
  addExam('Latein','Ex / Test',schoolDayIn(3),'Vokabeln Lektion 38');
  addExam('Mathe','Schulaufgabe',schoolDayIn(7),'Terme und Gleichungen');
  return S;
}
function records(){
  const r={};
  for(const[k,c]of Object.entries(ARR))S[k].forEach(o=>{r[c+':'+o.id]={coll:c,data:o}});
  for(const[k,c]of Object.entries(MAP))Object.entries(S[k]).forEach(([d,v])=>{r[c+':'+d]={coll:c,data:{k:d,v}}});
  ONE.forEach(k=>{r[k]={coll:k,data:S[k]===undefined?null:S[k]}});
  return r;
}
function fromRecords(r){
  const s=blank();
  Object.values(r).forEach(({coll,data})=>{
    const a=Object.entries(ARR).find(x=>x[1]===coll);if(a){if(data)s[a[0]].push(data);return}
    const m=Object.entries(MAP).find(x=>x[1]===coll);if(m){if(data)s[m[0]][data.k]=data.v;return}
    if(ONE.includes(coll))s[coll]=data;
  });
  return migrate(s);
}

/* ===== Speicher und Sync ===== */
let synced={},syncedColl={},lastPull=null,pushT=null,pushing=false;
function writeCache(){try{localStorage.setItem(CACHE_KEY,JSON.stringify(REMOTE?{S,synced,syncedColl,lastPull}:S))}catch(e){}}
function readCache(){try{const x=JSON.parse(localStorage.getItem(CACHE_KEY));if(!x)return null;if(REMOTE){synced=x.synced||{};syncedColl=x.syncedColl||{};lastPull=x.lastPull||null;return migrate(x.S)}return migrate(x)}catch(e){return null}}
function save(){writeCache();if(REMOTE){clearTimeout(pushT);pushT=setTimeout(push,500)}}
async function push(){
  if(!REMOTE||!sb||!authOk)return;
  if(pushing){clearTimeout(pushT);pushT=setTimeout(push,800);return}
  pushing=true;
  try{
    const local=records(),up=[];
    for(const id in local){const j=JSON.stringify(local[id].data);if(synced[id]!==j)up.push({id,coll:local[id].coll,data:local[id].data,deleted:false})}
    for(const id in synced)if(!local[id])up.push({id,coll:syncedColl[id]||'x',data:null,deleted:true});
    for(let i=0;i<up.length;i+=200){
      const part=up.slice(i,i+200);
      const{error}=await sb.from('lp_data').upsert(part,{onConflict:'id'});if(error)throw error;

async function pull(full,fresh){
  if(!REMOTE||!sb)return false;
  const rows=[];
  for(let off=0;;off+=1000){
    let q=sb.from('lp_data').select('id,coll,data,deleted,updated_at').order('updated_at',{ascending:true}).order('id',{ascending:true});
    if(full)q=q.eq('deleted',false);
    else if(lastPull)q=q.gt('updated_at',new Date(new Date(lastPull).getTime()-5000).toISOString());
    const{data,error}=await q.range(off,off+999);if(error)throw error;
    rows.push(...data);if(data.length<1000)break;
  }
  const local=records();
  const dirty=new Set(fresh&&rows.length?[]:Object.keys(local).filter(id=>JSON.stringify(local[id].data)!==synced[id]));
  if(!fresh)Object.keys(synced).forEach(id=>{if(!local[id])dirty.add(id)});
  let base,changed=false;
  if(full){
    base={};dirty.forEach(id=>{if(local[id])base[id]=local[id]});
    const seen=new Set(rows.map(r=>r.id));
    Object.keys(synced).forEach(id=>{if(!seen.has(id)&&!dirty.has(id)){delete synced[id];delete syncedColl[id]}});
    changed=true;
  }else base=local;
  rows.forEach(r=>{
    if(!lastPull||r.updated_at>lastPull)lastPull=r.updated_at;
    if(dirty.has(r.id))return;
    if(r.deleted){if(base[r.id]){delete base[r.id];changed=true}delete synced[r.id];delete syncedColl[r.id];return}
    const j=JSON.stringify(r.data);
    if(!base[r.id]||JSON.stringify(base[r.id].data)!==j)changed=true;
    base[r.id]={coll:r.coll,data:r.data};synced[r.id]=j;syncedColl[r.id]=r.coll;
  });
  if(changed)S=fromRecords(base);
  ui.sync='ok';writeCache();
  return changed;
}

    if(verlegt(di)){
      // Verlegtes Spiel: nur Hausaufgaben für morgen und Lernen für eine Prüfung morgen.
      lern.filter(t=>exD[t.examId]<=nextWork).forEach(t=>place(t,true));
    }else{
    daily.forEach(t=>place(t,true));
    // Zuerst, was heute sein muss (überfällig oder Prüfung morgen), dann der Rest bis zum Richtwert.
    const mustL=t=>exD[t.examId]<=nextWork||t.date<di;
    lern.filter(mustL).forEach(t=>place(t,true));
    lern.filter(t=>!mustL(t)).forEach(t=>place(t,false));
    rest.forEach(t=>place(t,false));
    }
    day.items.sort((a,b)=>a.segs[0][0]-b.segs[0][0]);
    const lastEnd=Math.max(0,...day.items.map(it=>it.segs[it.segs.length-1][1]));
    day.breaks=day.breaks.filter(b=>b.s<lastEnd&&b.e>b.s);
    out.push(day);
  }

}
function queueOf(day){

  q.sort((a,b)=>((b.t.kind==='daily')-(a.t.kind==='daily'))||((a.segs?a.segs[0][0]:9999)-(b.segs?b.segs[0][0]:9999)));
  return q;
}

function finish(id){

  const P=planMin(t);let actual;
  if(S.running&&S.running.id===id){actual=Math.max(1,Math.round((Date.now()-S.running.at)/60000));S.running=null}
  else actual=Math.round(P*({kurz:.7,ok:1,lang:1.4}[ui.fbDur]));
  if(!t.fixed){const r=actual/t.est;learn(paceKey(t),r);learn(t.subject,r);learn('_all',r)}
  Object.assign(t,{done:true,doneAt:iso(today()),actual,planned:P,feel:ui.fbFeel});
  award(PTS.task,'Tor!',t.id);
  if(lmActive()){if(S.lm.clean)award(1,'Fokus-Tor',t.id);S.lm.clean=true}
  if(ui.fbFeel==='schwer'){
    S.help.push({id:uid(),date:iso(today()),subject:t.subject,title:t.title});
    if(t.examId){const nx=S.tasks.filter(x=>x.examId===t.examId&&!x.done).sort((a,b)=>a.date.localeCompare(b.date))[0];if(nx)nx.together=true}

  const T=iso(today());if(!S.run||S.run.date!==T)S.run={date:T,min:0};S.run.min+=actual;
  const long=S.run.min>=(+S.settings.longAfter||40),len=long?(+S.settings.longPause||15):(+S.settings.pause||5);if(long)S.run.min=0;
  ui.fb=null;checkDayWin();

  if(lmActive()&&toWin()===0)lmStop('Alles geschafft! Der Lernmodus ist beendet.');
  save();beam();
}

function shrink(file){return new Promise(res=>{
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{const k=Math.min(1,2000/Math.max(img.width,img.height)),c=document.createElement('canvas');

    URL.revokeObjectURL(url);c.toBlob(b=>res(b||file),'image/jpeg',.85)};

})}

// Schritte des Tages: erledigte Aufgaben, noch geplante (Maßstab ganzer Tag) und der Kabinen-Check.
function dayProgress(){
  const T=iso(today()),full=simulate({fullDay:true})[0];
  const done=S.tasks.filter(t=>t.done&&t.doneAt===T).length,open=full.free?0:full.items.length;
  const chk=S.settings.checksOn&&!full.free&&!verlegt(T)?1:0,chkDone=chk&&checksDone(T)?1:0;
  return{total:done+open+chk,done:done+chkDone};
}
// Anzeigetafel wie in der Halle: Heim (du) gegen Gast (der Schweinehund), darunter in einem Satz, wofür es Tore gibt.
const COURT=`url("data:image/svg+xml,${encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" preserveAspectRatio="none"><g fill="none" stroke="#fff" stroke-width="2"><rect x="6" y="6" width="388" height="188" rx="4"/><line x1="200" y1="6" x2="200" y2="194"/><circle cx="200" cy="100" r="3" fill="#fff"/><path d="M6 40 A60 60 0 0 1 66 100 A60 60 0 0 1 6 160"/><path d="M394 40 A60 60 0 0 0 334 100 A60 60 0 0 0 394 160"/><path d="M6 22 A88 88 0 0 1 94 100 A88 88 0 0 1 6 178" stroke-dasharray="7 7"/><path d="M394 22 A88 88 0 0 0 306 100 A88 88 0 0 0 394 178" stroke-dasharray="7 7"/></g></svg>')}")`;
document.head.insertAdjacentHTML('beforeend',`<style>.tafel{--court:${COURT}}</style>`);
function tafel(){
  const T=iso(today()),p=dayProgress(),g=goalsOn(T),c=concOn(T),th=THEMES[S.settings.theme]||THEMES[0];
  const prog=p.total&&p.total<=10?`<span class="pips" aria-hidden="true">${Array.from({length:p.total},(_,i)=>`<i class="${i<p.done?'on':''}"></i>`).join('')}</span>`
    :`<span class="pbar" aria-hidden="true"><i style="width:${p.total?Math.round(p.done/p.total*100):0}%"></i></span>`;
  const state=S.wins[T]?`Abpfiff: Sieg!`:verlegt(T)?'Spiel verlegt':!p.total?'Heute kein Spiel':!S.kick[T]?'Noch nicht angepfiffen':`${p.done} von ${p.total} geschafft`;
  return `<button class="tafel" data-act="report" aria-expanded="${!!ui.report}" aria-label="Spielstand: du ${g}, Schweinehund ${c}. ${state}. Spielbericht ${ui.report?'zuklappen':'zeigen'}">

    <span class="t-score"><b>${g}</b><i>:</i><b>${c}</b></span>
    <span class="t-team r"><span class="t-side">Gast</span><span class="t-name">Schweinehund</span></span></span>
    <span class="t-row2">${prog}<span class="t-state">${state}</span><span class="t-more">Spielbericht</span></span></button>
  <div class="t-rule">Jede erledigte Aufgabe ist ein Tor für dich. Der Schweinehund trifft, wenn du dich ablenken lässt.</div>`;
}
// Spielbericht: jedes Tor mit Uhrzeit, Zwischenstand und Grund.
function spielbericht(){
  const T=iso(today()),k=S.kick[T];
  const ev=S.goals.filter(x=>x.date===T).map((x,i)=>({at:x.at||0,i,us:true,n:x.n,txt:x.why==='Tor!'?`Tor: ${((S.tasks.find(t=>t.id===x.taskId)||{}).title)||'Aufgabe erledigt'}`:`${goalName(x.why)}${GOAL_WHY[x.why]?': '+GOAL_WHY[x.why]:''}`}))
    .concat(S.conc.filter(x=>x.date===T).map((x,i)=>({at:x.at||0,i:1000+i,us:false,n:1,txt:x.why})))
    .sort((a,b)=>a.at-b.at||a.i-b.i);
  let g=0,c=0;
  const rows=ev.map(e=>{if(e.us)g+=e.n;else c+=e.n;const d=e.at?new Date(e.at):null;
    return `<div class="sb-row ${e.us?'':'opp'}"><span class="sb-t">${d?hm(d.getHours()*60+d.getMinutes()):''}</span><span class="sb-s">${g}:${c}</span><span class="grow">${e.us?'':'<b>Schweinehund</b> '}${esc(e.txt)}</span></div>`}).join('');
  return `<div class="card bericht"><div class="k-lab">Spielbericht${k?`, Anpfiff ${k}`:''}</div>${rows||'<div class="sub" style="margin-top:6px">Noch keine Tore. Mit dem Anpfiff geht es los.</div>'}
    <div class="sb-rules"><div><b>Du triffst</b> mit jeder erledigten Aufgabe. Extra-Tore: Tempogegenstoß, wenn du pünktlich anfängst, und Kempa-Trick, wenn du im Lernmodus eine ganze Aufgabe ohne Ablenkung schaffst.</div>
    <div><b>Der Schweinehund trifft</b>, wenn du im Lernmodus länger als eine Minute aus der App gehst oder mehr als eine halbe Stunde zu spät anfängst.</div>
    <div><b>Sieg</b> heißt: alles geschafft, Kabinen-Check gemacht und mehr Tore als der Schweinehund.</div></div></div>`;
}

    return f+(jokerUsed()||S.wins[T]||!q.length?'':'<div class="foot"><button class="lnk" data-act="jokerask">Heute geht gar nichts? Spiel verlegen</button></div>')+addButtons(true);

Antworte nur mit JSON: {"woche":"B","montag":"2026-11-16","tage":{"1":["Geschichte","Deutsch",""],"2":[...],"3":null,"4":[...],"5":[...]}}`,imgs);
    const tt=S.timetable||ttNew(),typ=/^[AB]$/.test(res.woche||'')?res.woche:(ui.ttType||weekType(today()));

/* ===== Rendern ===== */
function render(){
  let ch=ensureDaily();
  if(evaluateDays())ch=true;
  if(S.lm&&S.lm.on&&S.lm.date!==iso(today())){S.lm=Object.assign({},S.lm,{on:false});ch=true}
  if(lmActive()&&toWin()===0){lmStop('Alles geschafft! Der Lernmodus ist beendet.');ch=true}
  if(lmHere()){ui.tab='heute';ui.full=false;ui.day=0}
  document.body.classList.toggle('lm',lmHere());
  const plan=simulate(),T=iso(today());
  if(!plan[0].free){const tot=plan[0].used+plan[0].over.reduce((a,o)=>a+o.P,0)+S.tasks.filter(t=>t.done&&t.doneAt===T).reduce((a,t)=>a+(t.planned||0),0);
    const cur=S.days[T]||{};if(!cur.planned||tot>cur.planned){S.days[T]=Object.assign({},cur,{planned:tot});ch=true}}
  if(ch)save();

async function init(){
  const cached=readCache();
  S=cached||(REMOTE?defaults():seed());
  render();
  if(!REMOTE){save();return}
  try{
    if(!window.supabase)await new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';sc.onload=res;sc.onerror=rej;document.head.append(sc)});
    sb=window.supabase.createClient(FCFG.supabaseUrl,FCFG.supabaseKey);
    const{data}=await sb.auth.getSession();
    accessToken=(data&&data.session&&data.session.access_token)||'';
    sb.auth.onAuthStateChange((ev,ses)=>{if(ses&&ses.access_token)accessToken=ses.access_token});
    if(!data||!data.session){authOk=false;if(!cached){document.getElementById('app').innerHTML='<div class="card"><h2>Bitte zuerst anmelden</h2><div class="sub">Der Lernplaner nutzt die Anmeldung des Familienplans. Öffne zuerst den Familienplan auf diesem Gerät und melde dich an.</div><div class="row" style="margin-top:12px"><a class="btn primary" href="index.html">Zum Familienplan</a></div></div>';return}}
  }catch(e){ui.sync='err';console.warn(e)}
  if(sb&&authOk){
    try{await pull(true,!cached)}catch(e){ui.sync='err';console.warn(e)}
    try{const{data}=await sb.from('ep_persons').select('id,name,adult').order('sort');persons=data||[];kids=persons.filter(p=>!p.adult)}catch(e){}
    await loadFam();
  }
  render();push();
  const refresh=async()=>{if(ui.fb||ui.edit||ui.quiz||document.activeElement&&/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))return;
    try{const a=await pull(false),b=await loadFam();if(a||b)render();else syncDot()}catch(e){ui.sync='err';syncDot()}};
  setInterval(refresh,45000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refresh()});
}
/* ===== Neue Version: wie im Familienplan ===== */
// Der Service Worker des Familienplans lädt neue Fassungen im Hintergrund und meldet sie. Ein Tipp lädt sie.
function updateBanner(){
  if(document.getElementById('neue-version'))return;
  const b=document.createElement('button');b.id='neue-version';b.className='neue-version';b.type='button';
  b.textContent='Neue Version der App. Tippen zum Laden.';b.addEventListener('click',()=>location.reload());document.body.appendChild(b);
}
if('serviceWorker' in navigator&&window.isSecureContext){
  navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.type==='neue-version')updateBanner()});
  const check=()=>{if(navigator.serviceWorker.controller)navigator.serviceWorker.controller.postMessage({type:'pruefen'})};
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')check()});
  // Auch wenn nur der Lernplaner auf dem Handy benutzt wird, den Service Worker anmelden.
  navigator.serviceWorker.register('sw.js').then(()=>check()).catch(()=>{});
}
init();
