<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lernplaner">
<meta name="theme-color" content="#F5C400">
<link rel="manifest" href="lernen.webmanifest">
<link rel="apple-touch-icon" href="icons/lernen-180.png">
<script src="js/config.js"></script>
<title>Lernplaner</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1f1e1c;--tx2:#6b6a65;--bd:rgba(0,0,0,.12);--ac:#185FA5;--acbg:#E6F1FB;--ok:#3B6D11;--okbg:#EAF3DE;--wa:#854F0B;--wabg:#FAEEDA;--er:#A32D2D;--erbg:#FCEBEB;--soft:#efeee9;--fill:#F5C400;--on:#111;--stripe:#111}
@media (prefers-color-scheme:dark){:root{--bg:#1b1b1a;--card:#262624;--tx:#eceae4;--tx2:#a5a39c;--bd:rgba(255,255,255,.14);--ac:#85B7EB;--acbg:#0C447C;--ok:#C0DD97;--okbg:#27500A;--wa:#FAC775;--wabg:#633806;--er:#F7C1C1;--erbg:#791F1F;--soft:#31312e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;background:var(--bg);z-index:2;padding:14px 16px 0;max-width:560px;margin:0 auto}
.band{height:6px;border-radius:3px;background:repeating-linear-gradient(90deg,var(--fill) 0 28px,var(--stripe) 28px 56px);margin-top:10px}
main{max-width:560px;margin:0 auto;padding:4px 16px 80px}
h1{font-size:20px;font-weight:600;margin:0}
h2{font-size:16px;font-weight:600;margin:0 0 10px}
.sub{color:var(--tx2);font-size:13px}
.tabs{display:flex;border-bottom:1px solid var(--bd)}
.tab{flex:1;padding:10px 0;border:0;background:none;color:var(--tx2);font:inherit;font-size:14px;border-bottom:3px solid transparent;cursor:pointer}
.tab.on{color:var(--tx);border-color:var(--tx);font-weight:600}
.sync{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:6px;background:var(--tx2);vertical-align:1px}
.sync.ok{background:#639922}.sync.err{background:#E24B4A}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0}
.days{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px}
.day{flex:0 0 auto;border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:6px 10px;font:inherit;font-size:13px;color:var(--tx);text-align:center;cursor:pointer;min-width:54px;line-height:1.3}
.day.on{background:var(--fill);color:var(--on);border-color:var(--fill)}
.day small{display:block;font-size:11px;opacity:.8}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.chip{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--soft);display:inline-block}
.chip.wa{background:var(--wabg);color:var(--wa)}.chip.ok{background:var(--okbg);color:var(--ok)}.chip.er{background:var(--erbg);color:var(--er)}
.item{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--c,#888);border-radius:12px;padding:12px;margin:8px 0}
.item.appt{background:var(--soft);border-left-color:var(--tx2)}
.grow{flex:1;min-width:0}
.tt{font-weight:600}
.meta{font-size:13px;color:var(--tx2)}
.time{font-size:13px;margin-top:2px}
.chk{width:30px;height:30px;border-radius:8px;border:2px solid var(--bd);background:var(--card);flex-shrink:0;cursor:pointer}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:9px;padding:7px 12px;font-size:14px;text-decoration:none;display:inline-block}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.primary{background:var(--fill);border-color:var(--stripe);color:var(--on)}
.btn.big{font-size:17px;padding:12px 18px;font-weight:600}
.btn.on{background:var(--acbg);border-color:var(--ac);color:var(--ac)}
.btn.danger{color:var(--er)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fb{margin-top:12px;padding-top:10px;border-top:1px solid var(--bd)}
.fb .q{font-size:14px;margin:8px 0 6px}
label{display:block;font-size:13px;color:var(--tx2);margin:8px 0 0}
input,select,textarea{display:block;width:100%;max-width:100%;min-width:0;font:inherit;font-size:16px;padding:8px 10px;margin-top:3px;border:1px solid var(--bd);border-radius:9px;background:var(--card);color:var(--tx)}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;min-height:42px;text-align:left}
input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value{text-align:left}
input[type=checkbox]{display:inline;width:auto;min-height:0;margin-right:6px}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.g5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.g2>label,.g5>label{min-width:0}
@media (max-width:480px){.g2{grid-template-columns:minmax(0,1fr);gap:0}.g5{grid-template-columns:repeat(3,minmax(0,1fr))}}
.note{font-size:13px;padding:8px 12px;border-radius:10px;background:var(--acbg);color:var(--ac);margin:10px 0}
.warn{background:var(--wabg);color:var(--wa)}.err{background:var(--erbg);color:var(--er)}.okn{background:var(--okbg);color:var(--ok)}
.li{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--bd);font-size:14px;flex-wrap:wrap}
.li:first-of-type{border-top:0}
.bar{height:10px;background:var(--soft);border-radius:5px;overflow:hidden;margin:6px 0}
.bar div{height:100%;background:var(--fill)}
.bar div.full{background:#BA7517}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px;flex-shrink:0}
.muted{color:var(--tx2)}
.big{font-size:22px;font-weight:600}
.score{display:flex;justify-content:space-between;align-items:center;gap:10px}
.score .n{font-size:28px;font-weight:700;line-height:1}
.wk{display:flex;gap:6px;margin-top:10px}
.wk div{flex:1;text-align:center;font-size:12px;padding:6px 0;border-radius:8px;background:var(--soft);color:var(--tx2)}
.wk div.won{background:var(--okbg);color:var(--ok);font-weight:600}
.wk div.lost{background:var(--erbg);color:var(--er)}
.wk div.now{outline:2px solid var(--tx)}
.focus{border:2px solid var(--c);border-left-width:8px}
.focus .label{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--c);text-transform:uppercase}
.focus .ft{font-size:21px;font-weight:700;margin:4px 0}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.badge{border:1px solid var(--bd);border-radius:12px;padding:10px;font-size:13px}
.badge.off{opacity:.45}
.badge b{display:block;font-size:14px}
.jer{display:flex;flex-direction:column;align-items:center;gap:4px;width:84px;font-size:11px;text-align:center;background:none;border:0;color:var(--tx);padding:4px}
.jer .sh{width:56px;height:56px;border-radius:12px 12px 8px 8px;border:3px solid transparent;background:repeating-linear-gradient(90deg,var(--m) 0 10px,var(--s) 10px 14px)}
.jer.on .sh{border-color:var(--tx)}
.jer.lock{opacity:.3;cursor:default}
pre.rep{white-space:pre-wrap;font:inherit;font-size:14px;margin:0}
#toast{position:fixed;left:50%;top:90px;transform:translateX(-50%);background:var(--fill);color:var(--on);border:2px solid var(--stripe);padding:14px 26px;border-radius:16px;font-weight:700;font-size:22px;text-align:center;z-index:9;animation:pop 2.4s ease forwards;pointer-events:none}
#toast small{display:block;font-size:13px;font-weight:500}
@keyframes pop{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}12%{opacity:1;transform:translate(-50%,0) scale(1.08)}20%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0}}
</style>
</head>
<body>
<header>
  <div class="row" style="justify-content:space-between"><h1>Mein Lerntag</h1><span class="sub"><span id="today"></span><span class="sync" id="sync" title=""></span></span></div>
  <div class="sub" style="margin-top:2px"><a href="index.html" style="color:inherit">Zum Familienplan</a></div>
  <div class="band"></div>
  <nav class="tabs">
    <button class="tab" data-act="tab" data-v="heute">Heute</button>
    <button class="tab" data-act="tab" data-v="woche">Woche</button>
    <button class="tab" data-act="tab" data-v="pokale">Pokale</button>
    <button class="tab" data-act="tab" data-v="eltern">Eltern</button>
  </nav>
</header>
<main id="app"></main>
<script>
/* ===== Konfiguration: kommt aus js/config.js der Familien-App ===== */
const FCFG=window.ESSENSPLAN_CONFIG||{};
const REMOTE=!!(FCFG.supabaseUrl&&FCFG.supabaseKey);
let sb=null,authOk=true,kids=[];
const CACHE_KEY=REMOTE?'lernplaner-web-v1':'lernplaner-v1';

const SUBJ=['Mathe','Deutsch','Englisch','Latein','Biologie','Physik','Natur und Technik','Geschichte','Geographie','Wirtschaft','Religion/Ethik','Musik','Kunst','Sonstiges'];
const COL={Mathe:'#378ADD',Deutsch:'#D85A30',Englisch:'#1D9E75',Latein:'#7F77DD',Biologie:'#639922',Physik:'#BA7517','Natur und Technik':'#97C459',Geschichte:'#993C1D',Geographie:'#0F6E56',Wirtschaft:'#5F5E5A','Religion/Ethik':'#534AB7',Musik:'#D4537E',Kunst:'#ED93B1',Sonstiges:'#888780'};
const WD=['So','Mo','Di','Mi','Do','Fr','Sa'];
const WDL=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const EXAM={'Schulaufgabe':[[-8,30],[-6,30],[-4,30],[-3,30],[-2,35],[-1,20]],'Kurzarbeit':[[-4,20],[-2,25],[-1,15]],'Ex / Test':[[-3,20],[-2,20],[-1,15]],'Referat':[[-10,30],[-7,30],[-4,30],[-2,30],[-1,20]]};
const LIGA=[['Kreisliga',0],['Bezirksliga',40],['Bezirksoberliga',100],['Landesliga',180],['Bayernliga',280],['3. Liga',400],['2. Bundesliga',550],['1. Bundesliga',750],['Europapokal',1000]];
const THEMES=[
  {n:'Coburg Heim',d:'gelb-schwarz',m:'#F5C400',on:'#111111',s:'#111111',lvl:0},
  {n:'Blau',d:'',m:'#185FA5',on:'#ffffff',s:'#ffffff',lvl:1},
  {n:'Rot',d:'',m:'#B3261E',on:'#ffffff',s:'#ffffff',lvl:2},
  {n:'Grün',d:'',m:'#2E7D32',on:'#ffffff',s:'#ffffff',lvl:3},
  {n:'Orange',d:'',m:'#C4520F',on:'#ffffff',s:'#111111',lvl:4},
  {n:'Coburg Auswärts',d:'schwarz-gelb',m:'#111111',on:'#F5C400',s:'#F5C400',lvl:5},
  {n:'Lila',d:'',m:'#6A3FB5',on:'#ffffff',s:'#ffffff',lvl:6},
  {n:'Kiel',d:'schwarz-weiß',m:'#111111',on:'#ffffff',s:'#ffffff',lvl:7},
  {n:'Gold',d:'Europapokal',m:'#9A7B0A',on:'#ffffff',s:'#111111',lvl:8}];
const PTS={task:2,check:1,kick:1,fair:1,win:3,review:1,meet:3};
const CHECKS=[['latein','Latein'],['englisch','Englisch']];

const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const toMin=s=>{const[h,m]=String(s).split(':').map(Number);return h*60+(m||0)};
const hm=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const r5=m=>Math.max(5,Math.round(m/5)*5);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>{const d=parse(s);return WD[d.getDay()]+', '+d.getDate()+'.'+(d.getMonth()+1)+'.'};
const diff=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const col=s=>COL[s]||'#888780';
const nowMin=()=>{const n=new Date();return n.getHours()*60+n.getMinutes()};
const isWeekday=d=>d.getDay()>=1&&d.getDay()<=5;
function schoolDayIn(n){let d=addDays(today(),n);while(!isWeekday(d))d=addDays(d,1);return iso(d)}
function monday(d){const x=new Date(d);return addDays(x,-((x.getDay()+6)%7))}

let S,ui={tab:'heute',day:0,fb:null,fbDur:'ok',fbFeel:'mittel',unlocked:false,addHA:false,msg:'',msgType:'',scanOpen:false,scan:{status:'idle'},focus:null,full:false,edit:null,busy:null,rv:{},sync:REMOTE?'':'local'};

/* ===== Claude ===== */
let SAMPLE=null;
// Ferien und Feiertage aus dem Familienplan (js/logic.js). Fehlt die Datei, gelten nur die Wochenenden.
let CAL=null;
try{import('./js/logic.js').then(m=>{CAL=m;if(S)render()}).catch(()=>{})}catch(e){}
function freeReason(d){if(!isWeekday(d))return null;try{return CAL?CAL.schoolFree(iso(d)):null}catch(e){return null}}
if(!REMOTE){try{if(window.claude&&window.claude.use)window.claude.use('sample').then(s=>{SAMPLE=s;render()}).catch(()=>{})}catch(e){}}
const AI_OK=()=>(REMOTE&&authOk&&!!sb)||!!SAMPLE;
function blobToB64(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res({type:b.type||'image/jpeg',data:String(r.result).split(',')[1]});r.onerror=rej;r.readAsDataURL(b)})}
function parseJSON(t){if(t&&typeof t==='object')return t;const s=String(t||''),a=s.indexOf('{'),b=s.lastIndexOf('}');if(a<0||b<a)throw{code:'parse'};return JSON.parse(s.slice(a,b+1))}
async function aiText(prompt,images){
  images=images||[];
  if(REMOTE){
    const imgs=await Promise.all(images.map(blobToB64));
    const{data,error}=await sb.functions.invoke('lernplaner',{body:{prompt,images:imgs}});
    if(error){const st=error.context&&error.context.status;throw{code:st===429?'rate_limited':'error'}}
    return(data&&data.text)||'';
  }
  if(!SAMPLE)throw{code:'not_granted'};
  const res=await SAMPLE(prompt,images.length?{images,modelTier:'default'}:{modelTier:'default'});
  return res.text||'';
}
async function aiJSON(prompt,images){
  if(!REMOTE&&SAMPLE&&SAMPLE.json)return SAMPLE.json(prompt,(images&&images.length)?{images,modelTier:'default'}:{modelTier:'default'});
  return parseJSON(await aiText(prompt,images));
}
function aiError(e){
  const c=e&&e.code;
  if(c==='not_granted'){SAMPLE=null;return'Claude ist hier nicht verfügbar.'}
  if(c==='rate_limited')return'Gerade zu viele Anfragen. Bitte in ein paar Minuten noch einmal versuchen.';
  return'Das hat nicht geklappt. Bitte noch einmal versuchen.';
}

/* ===== Datenmodell ===== */
const ARR={tasks:'task',exams:'exam',appts:'appt',oneoffs:'oneoff',goals:'goal',help:'help',books:'book',results:'result'};
const MAP={wins:'win',kick:'kick',checks:'check',prizes:'prize',days:'day',meets:'meet'};
const ONE=['settings','pace','schoolEnd','running','meta','model','report','timetable'];
function blank(){return{settings:{},pace:{},schoolEnd:{},timetable:null,running:null,meta:{},model:{},report:null,tasks:[],exams:[],appts:[],oneoffs:[],goals:[],help:[],books:[],results:[],wins:{},kick:{},checks:{},prizes:{},days:{},meets:{}}}
function migrate(x){
  const b=blank();
  Object.keys(b).forEach(k=>{if(x[k]===undefined||x[k]===null&&k!=='running'&&k!=='report')x[k]=b[k]});
  if(x.v===1||x.v===2){ // alter Prototyp
    if(x.sample!==undefined)x.meta.sample=x.sample;
    x.tasks.forEach(t=>{if(t.kind==='lern')t.title=String(t.title).replace(/^(Lernen|Wiederholen): /,'')});
    x.goals.forEach(g=>{if(!g.id)g.id=uid()});
    delete x.v;delete x.sample;
  }
  x.settings=Object.assign({pin:'1234',afterSchool:60,latest:'19:30',weekendStart:'10:00',buffer:30,blockMax:15,pause:5,sundayFree:true,ludusOn:true,ludusMin:15,ludusUrl:'',checksOn:true,winGoal:4,bedtimeMin:30,theme:0},x.settings);
  if(typeof x.settings.theme!=='number')x.settings.theme=0;
  x.schoolEnd=Object.assign({1:'13:00',2:'15:30',3:'13:00',4:'13:00',5:'12:15'},x.schoolEnd);
  x.model=Object.assign({cap:75,prep:{}},x.model);
  if(x.settings.holidaysFree===undefined)x.settings.holidaysFree=true;
  return x;
}
function defaults(){
  const s=migrate(blank());
  s.appts=[{id:uid(),title:'Handballtraining',weekday:2,start:'17:00',end:'18:30'},{id:uid(),title:'Handballtraining',weekday:4,start:'17:00',end:'18:30'}];
  s.meta={setup:false};
  return s;
}
function seed(){
  S=defaults();S.meta={sample:true,setup:false};
  addHA('Mathe','Buch S. 88 Nr. 3 und 4',schoolDayIn(1),20);
  addHA('Englisch','Workbook S. 42',schoolDayIn(1),15);
  addHA('Deutsch','Inhaltsangabe zu Ende schreiben',schoolDayIn(3),30);
  addExam('Latein','Ex / Test',schoolDayIn(3),'Vokabeln Lektion 38');
  addExam('Mathe','Schulaufgabe',schoolDayIn(7),'Terme und Gleichungen');
  return S;
}
function records(){
  const r={};
  for(const[k,c]of Object.entries(ARR))S[k].forEach(o=>{r[c+':'+o.id]={coll:c,data:o}});
  for(const[k,c]of Object.entries(MAP))Object.entries(S[k]).forEach(([d,v])=>{r[c+':'+d]={coll:c,data:{k:d,v}}});
  ONE.forEach(k=>{r[k]={coll:k,data:S[k]===undefined?null:S[k]}});
  return r;
}
function fromRecords(r){
  const s=blank();
  Object.values(r).forEach(({coll,data})=>{
    const a=Object.entries(ARR).find(x=>x[1]===coll);if(a){if(data)s[a[0]].push(data);return}
    const m=Object.entries(MAP).find(x=>x[1]===coll);if(m){if(data)s[m[0]][data.k]=data.v;return}
    if(ONE.includes(coll))s[coll]=data;
  });
  return migrate(s);
}

/* ===== Speicher und Sync ===== */
let synced={},syncedColl={},lastPull=null,pushT=null,pushing=false;
function writeCache(){try{localStorage.setItem(CACHE_KEY,JSON.stringify(REMOTE?{S,synced,syncedColl,lastPull}:S))}catch(e){}}
function readCache(){try{const x=JSON.parse(localStorage.getItem(CACHE_KEY));if(!x)return null;if(REMOTE){synced=x.synced||{};syncedColl=x.syncedColl||{};lastPull=x.lastPull||null;return migrate(x.S)}return migrate(x)}catch(e){return null}}
function save(){writeCache();if(REMOTE){clearTimeout(pushT);pushT=setTimeout(push,500)}}
async function push(){
  if(!REMOTE||!sb||!authOk)return;
  if(pushing){clearTimeout(pushT);pushT=setTimeout(push,800);return}
  pushing=true;
  try{
    const local=records(),up=[];
    for(const id in local){const j=JSON.stringify(local[id].data);if(synced[id]!==j)up.push({id,coll:local[id].coll,data:local[id].data,deleted:false})}
    for(const id in synced)if(!local[id])up.push({id,coll:syncedColl[id]||'x',data:null,deleted:true});
    for(let i=0;i<up.length;i+=200){
      const part=up.slice(i,i+200);
      const{error}=await sb.from('lp_data').upsert(part,{onConflict:'id'});if(error)throw error;
      part.forEach(u=>{if(u.deleted){delete synced[u.id];delete syncedColl[u.id]}else{synced[u.id]=JSON.stringify(u.data);syncedColl[u.id]=u.coll}});
    }
    ui.sync='ok';
  }catch(e){ui.sync='err';console.warn(e)}
  pushing=false;writeCache();syncDot();
}
async function pull(full,fresh){
  if(!REMOTE||!sb)return false;
  const rows=[];
  for(let off=0;;off+=1000){
    let q=sb.from('lp_data').select('id,coll,data,deleted,updated_at').order('updated_at',{ascending:true}).order('id',{ascending:true});
    if(full)q=q.eq('deleted',false);
    else if(lastPull)q=q.gt('updated_at',new Date(new Date(lastPull).getTime()-5000).toISOString());
    const{data,error}=await q.range(off,off+999);if(error)throw error;
    rows.push(...data);if(data.length<1000)break;
  }
  const local=records();
  const dirty=new Set(fresh&&rows.length?[]:Object.keys(local).filter(id=>JSON.stringify(local[id].data)!==synced[id]));
  if(!fresh)Object.keys(synced).forEach(id=>{if(!local[id])dirty.add(id)});
  let base,changed=false;
  if(full){
    base={};dirty.forEach(id=>{if(local[id])base[id]=local[id]});
    const seen=new Set(rows.map(r=>r.id));
    Object.keys(synced).forEach(id=>{if(!seen.has(id)&&!dirty.has(id)){delete synced[id];delete syncedColl[id]}});
    changed=true;
  }else base=local;
  rows.forEach(r=>{
    if(!lastPull||r.updated_at>lastPull)lastPull=r.updated_at;
    if(dirty.has(r.id))return;

function windowsFor(d,isToday){
  const st=S.settings,appts=apptsFor(d);
  if(isFree(d))return{wins:[],appts,free:true};
  let start=dayStart(d);const end=toMin(st.latest);
  if(isToday)start=Math.max(start,Math.ceil(nowMin()/5)*5);

    wins=wins.flatMap(([s,e])=>{const o=[];if(a0>s)o.push([s,Math.min(e,a0)]);if(a1<e)o.push([Math.max(s,a1),e]);return o}).filter(([s,e])=>e-s>=10)});

function alloc(cap,P){
  const bm=+S.settings.blockMax,pz=+S.settings.pause,c=cap.map(w=>w.slice()),segs=[];let rem=P;
  for(const w of c){while(rem>0&&w[1]-w[0]>=Math.min(rem,10)){const len=Math.min(rem,bm,w[1]-w[0]);segs.push([w[0],w[0]+len]);w[0]=Math.min(w[1],w[0]+len+pz);rem-=len}if(rem<=0)break}

function simulate(){
  const t0=today(),T=iso(t0),out=[],placed=new Set(),exD={};
  S.exams.forEach(e=>exD[e.id]=e.date);
  const open=S.tasks.filter(t=>!t.done&&!(t.examId&&(exD[t.examId]||'')<=T));
  const byDue=(a,b)=>a.due.localeCompare(b.due);
  const doneToday=S.tasks.filter(t=>t.done&&t.doneAt===T).reduce((a,t)=>a+(t.planned||0),0);
  for(let i=0;i<14;i++){
    const d=addDays(t0,i),di=iso(d);
    let nx=addDays(d,1);if(isFree(nx))nx=addDays(nx,1);const nextWork=iso(nx);
    const{wins,appts,free}=windowsFor(d,i===0),cap=wins.map(w=>w.slice()),lim=dayLimit(d),base=i===0?doneToday:0;
    const day={date:di,appts,free,items:[],over:[],capMin:wins.reduce((a,[s,e])=>a+e-s,0),used:0,lim};
    const ha=open.filter(t=>t.kind==='ha'&&!placed.has(t.id));
    const urgent=ha.filter(t=>t.due<=nextWork).sort(byDue);
    const daily=open.filter(t=>t.kind==='daily'&&t.date===di);
    const lern=open.filter(t=>t.kind==='lern'&&!placed.has(t.id)&&t.date<=di).sort((a,b)=>(exD[a.examId]||'').localeCompare(exD[b.examId]||''));
    const rest=ha.filter(t=>t.due>nextWork).sort(byDue);
    const place=(t,must)=>{const P=planMin(t);
      if(!must&&base+day.used+P>lim)return;

      else if(must){day.over.push({t,P});placed.add(t.id)}};
    urgent.forEach(t=>place(t,true));
    daily.forEach(t=>place(t,true));
    lern.forEach(t=>place(t,exD[t.examId]<=nextWork||t.date<di));
    rest.forEach(t=>place(t,false));
    day.items.sort((a,b)=>a.segs[0][0]-b.segs[0][0]);
    out.push(day);
  }
  return out;
}
function queueOf(day){
  const q=day.items.map(i=>({t:i.t,P:i.P,segs:i.segs})).concat(day.over.map(o=>({t:o.t,P:o.P,segs:null,over:true})));

  return q;
}

    const imgs=await Promise.all(files.slice(0,4).map(shrink)),t0=today(),T=iso(t0);
    const prompt=`Du liest Hausaufgaben aus Screenshots von Schulmanager Online (Bereich Klassenbuch oder Hausaufgaben). Der Schüler geht in die 7. Klasse eines bayerischen Gymnasiums.
Heute ist ${WDL[t0.getDay()]}, der ${T}. Datumsangaben ohne Jahr gehören zum laufenden Schuljahr. Angaben wie "morgen" beziehen sich auf heute.
Steht kein Abgabedatum da, nimm den nächsten Schultag: ${schoolDayIn(1)}.
Ordne jede Aufgabe genau einem dieser Fächer zu: ${SUBJ.join(', ')}. Kürzel wie M, D, E, L, B, Ph, NuT, G, Geo, WR, Ev, K, Eth, Mu, Ku bitte entsprechend zuordnen.
Gib für jede Aufgabe unter "gestellt" das Datum der Stunde an, in der sie aufgegeben wurde, also das Datum, unter dem sie im Schulmanager steht (YYYY-MM-DD). Ist das nicht erkennbar, setze "gestellt" auf null.
Lass reine Unterrichtsinhalte ohne Auftrag weg. Formuliere die Aufgabe kurz und konkret, so wie sie im Screenshot steht (Seiten, Nummern übernehmen).
Schätze für jede Aufgabe die Dauer in Minuten für ein Kind dieses Alters, zwischen 5 und 90.
Antworte nur mit JSON in genau dieser Form: {"hausaufgaben":[{"fach":"Mathe","aufgabe":"Buch S. 88 Nr. 3 und 4","gestellt":"YYYY-MM-DD","abgabe":"YYYY-MM-DD","minuten":20}]}
Wenn du keine Hausaufgaben erkennst: {"hausaufgaben":[]}`;
    const res=await aiJSON(prompt,imgs);
    const arr=Array.isArray(res)?res:((res&&res.hausaufgaben)||[]);
    const isoRe=/^\d{4}-\d{2}-\d{2}$/,known=x=>isoRe.test(x.gestellt||'');
    const all=arr.filter(x=>x&&(x.aufgabe||x.title)),kept=all.filter(x=>!known(x)||x.gestellt===T),hidden=all.length-kept.length;
    const items=kept.map(x=>{
      const subject=matchSubject(x.fach||x.subject),title=String(x.aufgabe||x.title).trim();
      let due=isoRe.test(x.abgabe||'')?x.abgabe:nextLesson(subject);if(due<=T)due=nextLesson(subject);
      let est=Math.round(+x.minuten||20);est=Math.min(90,Math.max(5,Math.round(est/5)*5));
      const dup=isDup(subject,title,due),unclear=!known(x);
      return{subject,title,due,est,dup,unclear,on:!dup&&!unclear};
    });
    ui.scan=items.length?{status:'review',items,hidden}:{status:'idle',err:hidden?`Auf dem Screenshot stehen nur Hausaufgaben von früheren Tagen (${hidden}). Von heute ist nichts dabei.`:'Auf dem Screenshot habe ich keine Hausaufgaben gefunden. Ist die Hausaufgaben-Seite zu sehen?'};
  }catch(e){ui.scan={status:'idle',err:aiError(e)}}
  render();
}

async function scanTimetable(){
  const inp=document.getElementById('ttfile'),files=[...((inp&&inp.files)||[])];
  if(!files.length){ui.msg='Bitte zuerst einen Screenshot auswählen.';ui.msgType='err';render();return}
  ui.busy='tt';render();
  try{
    const imgs=await Promise.all(files.slice(0,2).map(shrink));
    const res=await aiJSON(`Das ist ein Screenshot der Stundenplan-Wochenansicht aus Schulmanager Online (7. Klasse, Gymnasium in Bayern).
Lies den regulären Stundenplan ab. Zeilen sind die Stunden 1 bis 11, Spalten Montag bis Freitag.
- Jede Zelle: genau eines dieser Fächer, sonst "": ${TT_SUBJ.join(', ')}. Kürzel: D Deutsch, M Mathe, E Englisch, L Latein, NuT Natur und Technik, B Biologie, Ph Physik, G Geschichte, Geo Geographie, WR Wirtschaft, K/Ev/Eth Religion/Ethik, Mu Musik, Ku Kunst, Sm/Sw/Sp Sport, Ins Intensivierung, Blas Bläserklasse.
- Durchgestrichene, ausgefallene oder vertretene Stunden zählen wie normaler Unterricht im ursprünglichen Fach. Lehrerkürzel und Räume ignorieren.
- Ist an einem Tag gar kein regulärer Unterricht zu sehen (Feiertag, Ferien, ganztags grau), setze den Tag auf null.
- "woche": "A" oder "B", wenn A-Woche oder B-Woche auf dem Bild steht, sonst "".
- "montag": Datum des Montags als JJJJ-MM-TT, wenn erkennbar, sonst "".
Antworte nur mit JSON: {"woche":"B","montag":"2026-11-16","tage":{"1":["Geschichte","Deutsch",""],"2":[...],"3":null,"4":[...],"5":[...]}}`,imgs);
    const tt=S.timetable||ttNew(),typ=/^[AB]$/.test(res.woche||'')?res.woche:(ui.ttType||weekType(today()));
    if(/^[AB]$/.test(res.woche||'')&&/^\d{4}-\d{2}-\d{2}$/.test(res.montag||'')){tt.refWeek=iso(monday(parse(res.montag)));tt.refType=res.woche;tt.ab=true}
    const plan=Object.assign({},tt[typ]);let n=0;
    for(const w of [1,2,3,4,5]){const day=res.tage&&res.tage[String(w)];if(!Array.isArray(day))continue;
      const clean=day.slice(0,tt.times.length).map(x=>TT_SUBJ.includes(x)?x:(x?'Sonstiges':''));while(clean.length&&!clean[clean.length-1])clean.pop();
      if(clean.length){plan[w]=clean;n++}}
    tt[typ]=plan;S.timetable=tt;ui.ttType=typ;save();
    ui.msg=n?`${typ}-Woche übernommen (${n} Tage). Bitte kurz prüfen.`:'Auf dem Screenshot war kein Stundenplan zu erkennen.';ui.msgType=n?'okn':'err';
  }catch(e){ui.msg=aiError(e);ui.msgType='err'}
  ui.busy=null;render();
}

  h+=`<div class="card"><h2>Offene Aufgaben</h2>${open.length?open.map(t=>ui.edit===t.id?
    `<form data-form="edit" data-id="${t.id}" style="padding:8px 0;border-top:1px solid var(--bd)"><label>Auftrag<input name="title" value="${esc(t.title)}" required></label><div class="row" style="margin-top:8px"><button class="btn sm primary">Speichern</button><button type="button" class="btn sm" data-act="editx">Abbrechen</button></div></form>`:
    `<div class="li"><span class="dot" style="background:${col(t.subject)}"></span><span class="grow">${esc(t.subject)}: ${esc(t.title)}<br><span class="sub">${t.kind==='ha'?'bis '+fmt(t.due):'am '+fmt(t.date)} · geschätzt ${t.est} Min., geplant ${planMin(t)} Min.</span></span><button class="btn sm" data-act="edit" data-id="${t.id}">Ändern</button><button class="btn sm" data-act="est" data-v="-5" data-id="${t.id}" aria-label="5 Minuten weniger">−5</button><button class="btn sm" data-act="est" data-v="5" data-id="${t.id}" aria-label="5 Minuten mehr">+5</button>${t.kind==='ha'?`<button class="btn sm danger" data-act="del" data-id="${t.id}">Löschen</button>`:''}</div>`).join(''):'<div class="muted">Alles erledigt.</div>'}</div>`;
  h+=`<div class="card"><h2>Lehrwerke</h2><div class="sub">Mit Buch, aktueller Lektion und Inhaltsverzeichnis kann Claude die Lernschritte vor Prüfungen genau auf euer Buch abstimmen.</div>
  ${S.books.map(b=>`<div style="border-top:1px solid var(--bd);margin-top:10px;padding-top:8px"><div class="row"><span class="dot" style="background:${col(b.subject)}"></span><b class="grow">${esc(b.subject)}: ${esc(b.title)}</b><button class="btn sm danger" data-act="delbook" data-id="${b.id}">Löschen</button></div>
    <div class="sub">${b.isbn?'ISBN '+esc(b.isbn)+' · ':''}${b.toc?'Inhaltsverzeichnis gespeichert ('+String(b.toc).split('\n').length+' Zeilen)':'noch kein Inhaltsverzeichnis'}</div>
    <form data-form="chapter" data-id="${b.id}" class="row" style="margin-top:6px"><input name="chapter" value="${esc(b.chapter||'')}" placeholder="Aktuell: Lektion 41" style="flex:1"><button class="btn sm">Speichern</button></form>
    ${AI_OK()?`<div class="row" style="margin-top:6px"><input type="file" id="toc-${b.id}" accept="image/*" multiple style="flex:1"><button class="btn sm" data-act="toc" data-id="${b.id}">${ui.busy==='toc-'+b.id?'Moment …':'Inhaltsverzeichnis lesen'}</button></div>`:''}</div>`).join('')}
  <form data-form="book" style="margin-top:12px;border-top:1px solid var(--bd);padding-top:8px"><div class="g2"><label>Fach<select name="subject">${subjOpts()}</select></label><label>Titel<input name="title" required placeholder="Campus C2 neu, Ausgabe Bayern"></label></div>
  <div class="g2"><label>ISBN (optional)<input name="isbn" inputmode="numeric"></label><label>Aktuelle Lektion<input name="chapter" placeholder="Lektion 41"></label></div>
  <div class="row" style="margin-top:10px"><button class="btn">Lehrwerk hinzufügen</button></div></form></div>`;
  const all=S.appts.map(a=>({...a,lab:'jeden '+WDL[a.weekday]})).concat(S.oneoffs.filter(a=>a.date>=T).map(a=>({...a,lab:fmt(a.date)})));
  h+=`<div class="card"><h2>Feste Termine</h2>${all.map(a=>`<div class="li"><span class="grow">${esc(a.title)}<br><span class="sub">${a.lab}, ${a.start} bis ${a.end}</span></span><button class="btn sm danger" data-act="delappt" data-id="${a.id}">Löschen</button></div>`).join('')||'<div class="muted">Keine Termine.</div>'}
  <form data-form="appt" style="margin-top:10px"><label>Was<input name="title" required placeholder="Handballtraining"></label>
  <div class="g2"><label>Wann<select name="when">${[1,2,3,4,5,6,0].map(w=>`<option value="w${w}">jeden ${WDL[w]}</option>`).join('')}<option value="once">einmalig</option></select></label><label>Datum (nur bei einmalig)<input type="date" name="date"></label></div>
  <div class="g2"><label>Beginn<input type="time" name="start" required value="17:00"></label><label>Ende<input type="time" name="end" required value="18:30"></label></div>
  <div class="row" style="margin-top:12px"><button class="btn">Termin hinzufügen</button></div></form>
  <div class="sub" style="margin-top:8px">Vor und nach jedem Termin hält der Plan ${st.buffer} Min. frei (Fahrt, Umziehen, Essen).</div></div>`;
  h+=`<form data-form="settings" class="card"><h2>Einstellungen</h2>
  <div class="sub">Schulschluss: kommt aus dem Stundenplan</div>
  <div class="g2"><label>Pause nach der Schule (Min.)<input type="number" name="afterSchool" min="0" max="180" value="${st.afterSchool}"></label><label>Spätestens fertig um<input type="time" name="latest" value="${st.latest}"></label></div>
  <div class="g2"><label>Am Samstag ab<input type="time" name="weekendStart" value="${st.weekendStart}"></label><label>Puffer um Termine (Min.)<input type="number" name="buffer" min="0" max="90" value="${st.buffer}"></label></div>
  <div class="g2"><label>Längster Lernblock (Min.)<input type="number" name="blockMax" min="10" max="60" value="${st.blockMax}"></label><label>Pause zwischen Blöcken (Min.)<input type="number" name="pause" min="0" max="20" value="${st.pause}"></label></div>
  <label style="color:var(--tx)"><input type="checkbox" name="sundayFree" ${st.sundayFree?'checked':''}>Sonntag lernfrei</label>
  <label style="color:var(--tx)"><input type="checkbox" name="holidaysFree" ${st.holidaysFree!==false?'checked':''}>Ferien und Feiertage lernfrei</label>
  <div class="sub" style="margin-top:14px">Ludus Latinus</div>
  <label style="color:var(--tx)"><input type="checkbox" name="ludusOn" ${st.ludusOn?'checked':''}>Jeden Lerntag fest einplanen</label>
  <div class="g2"><label>Dauer (Min.)<input type="number" name="ludusMin" min="5" max="60" value="${st.ludusMin}"></label><label>Link zur App (optional)<input name="ludusUrl" type="url" value="${esc(st.ludusUrl)}" placeholder="https://…"></label></div>
  <label style="color:var(--tx)"><input type="checkbox" name="checksOn" ${st.checksOn?'checked':''}>Täglicher Vokabelkasten-Check (Latein und Englisch)</label>
  ${REMOTE?`<div class="sub" style="margin-top:14px">Push-Nachrichten</div>
  <label style="color:var(--tx)"><input type="checkbox" name="pushOn" ${st.pushOn!==false?'checked':''}>Erinnerungen aufs Handy</label>
  <div class="sub">Kind: Anpfiff zur Startzeit, Endspurt eine Stunde vor Schluss, Abend vor einer Prüfung. Eltern: Stand am Abend, sofort Bescheid bei „schwer“, gewonnenes Wochenspiel. Sonntags die Mannschaftsbesprechung. Nicht an Ferientagen. Dafür müssen im Familienplan auf den Handys die Benachrichtigungen eingeschaltet sein.</div>`:''}
  <div class="sub" style="margin-top:14px">Wochenspiel</div>
  <div class="g2"><label>Tagessiege für die Siegprämie<input type="number" name="winGoal" min="1" max="5" value="${st.winGoal}"></label><label>Länger aufbleiben (Min.)<input type="number" name="bedtimeMin" min="5" max="120" value="${st.bedtimeMin}"></label></div>
  ${REMOTE&&kids.length?`<label>Für wen ist der Lernplaner? (Karte im Familienplan)<select name="kidId"><option value="">bitte wählen</option>${kids.map(k=>`<option value="${esc(k.id)}" ${st.kidId===k.id?'selected':''}>${esc(k.name)}</option>`).join('')}</select></label>`:''}
  <label>Neue PIN (leer lassen zum Behalten)<input name="pin" inputmode="numeric" autocomplete="off"></label>
  <div class="row" style="margin-top:12px"><button class="btn primary">Speichern</button></div></form>`;
  h+=`<div class="card"><h2>Daten</h2><div class="row">${S.meta.sample?'<button class="btn danger" data-act="clearsample">Beispieldaten löschen</button>':''}<button class="btn" data-act="lock">Elternbereich schließen</button></div>
  <div class="sub" style="margin-top:8px">${REMOTE?'Alles wird in der Datenbank des Familienplans gespeichert und auf allen Geräten abgeglichen. Den Stand seht ihr auch im Familienplan unter „Aufgaben“.':'Diese Version speichert nur in diesem Browser.'}</div></div>`;
  return h;
}

/* ===== Rendern ===== */
function render(){
  let ch=ensureDaily();
  if(evaluateDays())ch=true;
  const plan=simulate(),T=iso(today());
  if(!plan[0].free){const tot=plan[0].used+plan[0].over.reduce((a,o)=>a+o.P,0)+S.tasks.filter(t=>t.done&&t.doneAt===T).reduce((a,t)=>a+(t.planned||0),0);
    const cur=S.days[T]||{};if(!cur.planned||tot>cur.planned){S.days[T]=Object.assign({},cur,{planned:tot});ch=true}}
  if(ch)save();
  const th=THEMES[S.settings.theme]||THEMES[0],rs=document.documentElement.style;
  rs.setProperty('--fill',th.m);rs.setProperty('--on',th.on);rs.setProperty('--stripe',th.s);
  document.getElementById('today').textContent=WDL[today().getDay()]+', '+today().getDate()+'.'+(today().getMonth()+1)+'.';
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.v===ui.tab));
  document.getElementById('app').innerHTML=ui.tab==='heute'?renderHeute(plan):ui.tab==='woche'?renderWoche(plan):ui.tab==='pokale'?renderPokale():renderEltern(plan);
  syncDot();
  if(toastQ){const old=document.getElementById('toast');if(old)old.remove();
    const d=document.createElement('div');d.id='toast';d.innerHTML=`+${toastQ.n} ${toastQ.n===1?'Tor':'Tore'}<small>${esc(toastQ.why)}</small>`;
    document.body.appendChild(d);setTimeout(()=>d.remove(),2500);toastQ=null}
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id;
  const t=id&&S.tasks.find(x=>x.id===id);
  switch(a){
    case'tab':ui.tab=b.dataset.v;ui.fb=null;ui.full=false;ui.day=0;ui.sub='';window.scrollTo(0,0);break;
    case'day':ui.day=+b.dataset.i;ui.fb=null;break;
    case'full':ui.full=!ui.full;ui.day=0;ui.fb=null;break;
    case'focus':ui.focus=id;ui.fb=null;window.scrollTo(0,0);break;
    case'kick':{const T=iso(today()),w=windowsFor(today(),false).wins;S.kick[T]=hm(nowMin());if(w.length&&nowMin()<=w[0][0]+15)award(PTS.kick,'Pünktlicher Anpfiff');save();break}
    case'vchk':answerCheck(b.dataset.k,b.dataset.v==='1');break;
    case'check':ui.fb=id;ui.fbDur='ok';ui.fbFeel='mittel';break;
    case'fbdur':ui.fbDur=b.dataset.v;break;
    case'fbfeel':ui.fbFeel=b.dataset.v;break;
    case'fbsave':finish(ui.fb);break;
    case'fbcancel':ui.fb=null;break;
    case'start':S.running={id,at:Date.now()};if(!S.kick[iso(today())])S.kick[iso(today())]=hm(nowMin());save();break;
    case'undo':if(t){const d=t.doneAt;t.done=false;S.goals=S.goals.filter(g=>g.taskId!==id);if(S.wins[d]){delete S.wins[d];S.goals=S.goals.filter(g=>!(g.date===d&&g.why==='Tagessieg!'))}save()}break;
    case'rv':ui.rv[id]=Object.assign({},ui.rv[id],{[b.dataset.k]:b.dataset.v});break;
    case'rvsave':{const r=ui.rv[id]||{},e=S.exams.find(x=>x.id===id);if(!e)break;
      if(!r.feel||!r.prep){ui.msg='Bitte beide Fragen beantworten.';ui.msgType='err';break}
      S.results.push({id:uid(),examId:id,subject:e.subject,type:e.type,date:e.date,feel:r.feel,prep:r.prep});
      applyResult(e,r.feel,r.prep);award(PTS.review,'Spielanalyse');delete ui.rv[id];save();break}
    case'meet':S.meets[b.dataset.k]=iso(today());award(PTS.meet,'Mannschaftsbesprechung');save();break;
    case'toggleha':ui.addHA=!ui.addHA;ui.scanOpen=false;break;
    case'del':S.tasks=S.tasks.filter(x=>x.id!==id);save();break;
    case'est':if(t){t.est=Math.max(5,Math.min(120,t.est+(+b.dataset.v)));save()}break;
    case'edit':ui.edit=id;break;
    case'editx':ui.edit=null;break;
    case'grade':ui.edit='g-'+id;break;
    case'delexam':S.exams=S.exams.filter(x=>x.id!==id);S.tasks=S.tasks.filter(x=>x.examId!==id);save();break;
    case'refine':if(!ui.busy)refineExam(id);return;
    case'toc':if(!ui.busy)scanToc(id);return;
    case'report':if(!ui.busy)makeReport();return;
    case'delbook':S.books=S.books.filter(x=>x.id!==id);save();break;
    case'delappt':S.appts=S.appts.filter(x=>x.id!==id);S.oneoffs=S.oneoffs.filter(x=>x.id!==id);save();break;
    case'helpdone':S.help=S.help.filter(x=>x.id!==id);save();break;
    case'redeem':S.prizes[weekInfo().key]='eingelöst';save();break;
    case'theme':S.settings.theme=+b.dataset.i;save();break;
    case'lock':ui.unlocked=false;ui.sub='';break;
    case'sub':ui.sub=b.dataset.v;window.scrollTo(0,0);break;
    case'ttsuggest':{const tt=ttNew();tt.refWeek=TT_SUGGEST.week;tt.refType=TT_SUGGEST.type;tt.B=JSON.parse(JSON.stringify(TT_SUGGEST.days));S.timetable=tt;ui.ttType='B';ui.ttDay=3;save();ui.msg='Übernommen. Bitte noch den Mittwoch eintragen und die Uhrzeiten prüfen.';ui.msgType='okn';break}
    case'ttempty':S.timetable=ttNew();save();break;
    case'tttype':ui.ttType=b.dataset.v;break;
    case'ttday':ui.ttDay=+b.dataset.v;break;
    case'ttscan':if(!ui.busy)scanTimetable();return;
    case'scanopen':ui.scanOpen=true;ui.addHA=false;break;
    case'scancancel':ui.scan={status:'idle'};ui.scanOpen=false;break;
    case'scanrun':runScan();return;
    case'clearsample':{const keep={settings:S.settings,schoolEnd:S.schoolEnd,appts:S.appts,oneoffs:S.oneoffs,books:S.books};S=Object.assign(migrate(blank()),keep);S.meta={sample:false,setup:true};save();ui.msg='Beispieldaten gelöscht. Termine und Einstellungen bleiben erhalten, bitte prüfen.';break}
    default:return;
  }
  render();
});

document.addEventListener('submit',e=>{
  const f=e.target;if(!f.dataset.form)return;e.preventDefault();
  const v=Object.fromEntries(new FormData(f));
  switch(f.dataset.form){
    case'tt':{const tt=Object.assign({},S.timetable||ttNew());
      tt.times=tt.times.map((tm,i)=>[v['s'+i]||tm[0],v['e'+i]||tm[1]]);tt.timesOk=true;
      tt.ab=!!v.ab;tt.refWeek=iso(monday(today()));tt.refType=v.ref==='A'?'A':'B';
      S.timetable=tt;ui.msg='Stundenplan-Einstellungen gespeichert.';ui.msgType='okn';break}
    case'pin':if(v.pin===S.settings.pin)ui.unlocked=true;else{ui.msg='Die PIN stimmt nicht.';ui.msgType='err'}break;
    case'ha':if(!v.title.trim())return;addHA(v.subject,v.title.trim(),v.due,v.est);ui.addHA=false;ui.msg='Hausaufgabe gespeichert und eingeplant.';break;
    case'scanok':{
      let n=0;(ui.scan.items||[]).forEach((it,i)=>{if(!v['on'+i])return;const title=(v['t'+i]||'').trim();if(!title)return;
        const sub=v['s'+i]||it.subject,due=v['d'+i]||it.due;if(isDup(sub,title,due))return;addHA(sub,title,due,+v['m'+i]||it.est);n++});
      ui.scan={status:'idle'};ui.scanOpen=false;ui.msg=n?`${n} Hausaufgabe${n>1?'n':''} übernommen und eingeplant.`:'Keine neuen Hausaufgaben übernommen.';break}
    case'exam':{if(!v.date)return;const id=addExam(v.subject,v.type,v.date,v.topic.trim());ui.msg=`${v.subject} ${v.type} gespeichert. Die Lerneinheiten sind verteilt.`;ui.msgType='okn';save();if(AI_OK()){refineExam(id);return}break}
    case'edit':{const t=S.tasks.find(x=>x.id===f.dataset.id);if(t&&v.title.trim())t.title=v.title.trim();ui.edit=null;break}
    case'grade':{const r=S.results.find(x=>x.id===f.dataset.id);if(r)r.grade=String(v.grade).trim().slice(0,4);ui.edit=null;break}
    case'book':S.books=S.books.filter(b=>b.subject!==v.subject);S.books.push({id:uid(),subject:v.subject,title:v.title.trim(),isbn:(v.isbn||'').replace(/[^0-9Xx-]/g,''),chapter:(v.chapter||'').trim(),toc:''});ui.msg='Lehrwerk gespeichert.';ui.msgType='okn';break;
    case'chapter':{const b=S.books.find(x=>x.id===f.dataset.id);if(b)b.chapter=(v.chapter||'').trim();ui.msg='Aktuelle Lektion gespeichert.';ui.msgType='okn';break}
    case'appt':
      if(toMin(v.end)<=toMin(v.start)){ui.msg='Das Ende muss nach dem Beginn liegen.';ui.msgType='err';break}
      if(v.when==='once'){if(!v.date){ui.msg='Für einen einmaligen Termin bitte ein Datum angeben.';ui.msgType='err';break}S.oneoffs.push({id:uid(),title:v.title,date:v.date,start:v.start,end:v.end})}
      else S.appts.push({id:uid(),title:v.title,weekday:+v.when.slice(1),start:v.start,end:v.end});
      ui.msg='Termin gespeichert.';break;
    case'settings':{
      const st=Object.assign({},S.settings),se=Object.assign({},S.schoolEnd);
      st.afterSchool=+v.afterSchool||0;st.latest=v.latest||st.latest;st.weekendStart=v.weekendStart||st.weekendStart;
      st.buffer=+v.buffer||0;st.blockMax=Math.max(10,+v.blockMax||15);st.pause=+v.pause||0;st.sundayFree=!!v.sundayFree;st.holidaysFree=!!v.holidaysFree;
      st.ludusOn=!!v.ludusOn;st.ludusMin=Math.max(5,+v.ludusMin||15);st.ludusUrl=(v.ludusUrl||'').trim();
      st.checksOn=!!v.checksOn;st.winGoal=Math.min(5,Math.max(1,+v.winGoal||4));st.bedtimeMin=Math.max(5,+v.bedtimeMin||30);
      if(v.pin&&v.pin.trim())st.pin=v.pin.trim();
      if(v.kidId!==undefined)st.kidId=v.kidId;
      if(REMOTE)st.pushOn=!!v.pushOn;
      S.settings=st;S.schoolEnd=se;S.meta=Object.assign({},S.meta,{setup:true});
      ui.msg='Einstellungen gespeichert.';ui.msgType='okn';break}
  }
  save();render();
});

document.addEventListener('change',e=>{
  const el=e.target;
  if(el.matches&&el.matches('select[data-tt]')){
    const tt=S.timetable;if(!tt)return;const t=ui.ttType||weekType(today()),wd=ui.ttDay||1,i=+el.dataset.tt;
    const plan=Object.assign({},tt[t]),l=(plan[wd]||[]).slice();while(l.length<=i)l.push('');l[i]=el.value;while(l.length&&!l[l.length-1])l.pop();
    plan[wd]=l;tt[t]=plan;save();render();return;
  }
  if(el.matches&&el.matches('select[data-due]')){const f=el.closest('form'),d=f&&f.querySelector('input[name=due]');if(d)d.value=nextLesson(el.value)}
});

setInterval(()=>{document.querySelectorAll('[data-elapsed]').forEach(el=>el.textContent=Math.round((Date.now()-+el.dataset.elapsed)/60000))},15000);

/* ===== Start ===== */
async function init(){
  const cached=readCache();
  S=cached||(REMOTE?defaults():seed());
  render();
  if(!REMOTE){save();return}
  try{
    if(!window.supabase)await new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';sc.onload=res;sc.onerror=rej;document.head.append(sc)});
    sb=window.supabase.createClient(FCFG.supabaseUrl,FCFG.supabaseKey);
    const{data}=await sb.auth.getSession();
    if(!data||!data.session){authOk=false;if(!cached){document.getElementById('app').innerHTML='<div class="card"><h2>Bitte zuerst anmelden</h2><div class="sub">Der Lernplaner nutzt die Anmeldung des Familienplans. Öffne zuerst den Familienplan auf diesem Gerät und melde dich an.</div><div class="row" style="margin-top:12px"><a class="btn primary" href="index.html">Zum Familienplan</a></div></div>';return}}
  }catch(e){ui.sync='err';console.warn(e)}
  if(sb&&authOk){
    try{await pull(true,!cached)}catch(e){ui.sync='err';console.warn(e)}
    try{const{data}=await sb.from('ep_persons').select('id,name,adult').order('sort');kids=(data||[]).filter(p=>!p.adult)}catch(e){}
  }
  render();push();
  const refresh=async()=>{if(ui.fb||ui.edit||document.activeElement&&/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))return;
    try{if(await pull(false))render();else syncDot()}catch(e){ui.sync='err';syncDot()}};
  setInterval(refresh,45000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refresh()});
}
init();
</script>
