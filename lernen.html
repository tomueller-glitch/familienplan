<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lernplaner">
<meta name="theme-color" content="#F5C400">
<link rel="manifest" href="lernen.webmanifest">
<link rel="apple-touch-icon" href="icons/lernen-180.png">
<script src="js/config.js"></script>
<title>Lernplaner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Lernplaner. Gleiche Grundlage wie der Familienplan: Wand (Grau), Blatt (Weiß), Tinte (Petrol).
   Einziger Blickfang ist die Spielstand-Tafel. Die Trikotfarbe (--fill) erscheint nur auf Hauptknöpfen und in der Tafel. */
:root{--wand:#E7EDEF;--blatt:#fff;--tinte:#14323C;--tinte2:#4F6972;--linie:#D5DFE2;--leise:#F2F5F6;--tafel:#14323C;
  --ok:#2E7D55;--okbg:#E3F1E9;--wa:#8A5A00;--wabg:#FBF0D6;--er:#C42B24;--erbg:#FBE7E5;--ac:#1E5F74;--acbg:#E1EEF2;
  --fill:#F5C400;--on:#14323C;--stripe:#14323C;--anz:'Barlow Condensed','Arial Narrow',sans-serif;--text:'Barlow','Helvetica Neue',Arial,sans-serif}
@media (prefers-color-scheme:dark){:root{--wand:#0E1A1F;--blatt:#172930;--tinte:#E2EBED;--tinte2:#9AB0B7;--linie:#2B4048;--leise:#1D333B;--tafel:#0A1418;
  --ok:#7CC79C;--okbg:#173A29;--wa:#F0C46A;--wabg:#3A2C0C;--er:#F08A84;--erbg:#3F1B19;--ac:#8CC6D6;--acbg:#16343E}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--wand);color:var(--tinte);font:16px/1.45 var(--text)}
a{color:inherit}
header{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 4px;display:flex;justify-content:space-between;align-items:flex-end}
.brand{font:700 26px/1 var(--anz);letter-spacing:.01em}
.hdr-sub{font-size:14px;color:var(--tinte2);margin-top:4px}
.hdr-r{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--tinte2)}
.hdr-r a{text-decoration:none;border:1px solid var(--linie);border-radius:999px;padding:4px 12px;background:var(--blatt)}
main{max-width:560px;margin:0 auto;padding:6px 14px calc(92px + env(safe-area-inset-bottom,0px))}
/* Leiste unten wie im Familienplan */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--blatt);border-top:1px solid var(--linie);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs .in{display:flex;width:100%;max-width:560px}
.tab{flex:1;border:0;background:none;font:500 12px/1.2 var(--text);color:var(--tinte2);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;cursor:pointer;border-radius:10px}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--tinte);font-weight:600}
.tab.on svg{stroke-width:2.2}
.tab.on .pip{background:var(--fill)}
.pip{width:18px;height:3px;border-radius:2px;background:transparent;margin-top:1px}
.sync{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--linie)}
.sync.ok{background:var(--ok)}.sync.err{background:var(--er)}
h1{font:700 24px/1.1 var(--anz);margin:0}
h2{font:700 20px/1.15 var(--anz);margin:0 0 8px;letter-spacing:.01em}
h3{font:600 15px/1.3 var(--text);margin:0 0 2px}
.sub{color:var(--tinte2);font-size:14px}
.muted{color:var(--tinte2)}
.big{font:700 26px/1.1 var(--anz)}
/* Blätter */
.card{background:var(--blatt);border-radius:14px;padding:16px;margin:12px 0;border:1px solid var(--linie)}
.grp{border-top:1px solid var(--linie);margin-top:18px;padding-top:14px}
.li{display:flex;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--linie);font-size:15px;flex-wrap:wrap}
h2+.li,.sub+.li,.card>.li:first-child{border-top:0}
.grow{flex:1;min-width:0}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;flex-shrink:0}
/* Spielstand-Tafel: der eine Blickfang */
.board{background:var(--tafel);color:#fff;border-radius:18px;padding:16px 18px 18px;margin:12px 0}
.board .b-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.board .b-lab{font-size:13px;color:#A9C2C9}
.board .b-num{font:700 64px/0.9 var(--anz);color:#fff;margin-top:4px}
.board .b-liga{text-align:right}
.board .b-ligan{font:700 22px/1.1 var(--anz);color:var(--hl,var(--fill))}
.board .b-week{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:16px}
.board .b-week div{text-align:center;border-radius:8px;padding:6px 0 5px;background:rgba(255,255,255,.07);font:600 13px/1.2 var(--text);color:#A9C2C9}
.board .b-week div b{display:block;font:700 15px/1.2 var(--anz);color:#fff;margin-top:2px}
.board .b-week .won{background:var(--fill);color:var(--on)}
.board .b-week .won b{color:var(--on)}
.board .b-week .now{box-shadow:inset 0 0 0 2px rgba(255,255,255,.55)}
.board .b-week .lost b{color:#F08A84}
.board .b-prize{font-size:14px;color:#D6E3E7;margin-top:12px}
.board .btn.primary{width:100%;margin-top:14px;font:700 22px/1 var(--anz);padding:14px;letter-spacing:.02em}
.board .b-hint{font-size:13px;color:#A9C2C9;text-align:center;margin-top:8px}
/* Jetzt dran */
.focus{border-left:6px solid var(--c);padding-left:16px}
.focus .label{font:600 14px/1 var(--text);color:var(--tinte2)}
.focus .ft{font:700 26px/1.1 var(--anz);margin:8px 0 4px}
.meta{font-size:14px;color:var(--tinte2)}
.time{font-size:14px;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:13px;padding:3px 10px;border-radius:999px;background:var(--leise);color:var(--tinte2);display:inline-block}
.chip.wa{background:var(--wabg);color:var(--wa)}.chip.ok{background:var(--okbg);color:var(--ok)}.chip.er{background:var(--erbg);color:var(--er)}
/* Tagesplan */
.days{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px}
.day{flex:0 0 auto;border:1px solid var(--linie);background:var(--blatt);border-radius:10px;padding:6px 10px;font:600 14px/1.25 var(--text);color:var(--tinte);text-align:center;cursor:pointer;min-width:56px}
.day.on{background:var(--tinte);color:var(--blatt);border-color:var(--tinte)}
.day small{display:block;font-size:12px;font-weight:400;opacity:.8}
.item{display:flex;gap:12px;align-items:flex-start;background:var(--blatt);border:1px solid var(--linie);border-left:5px solid var(--c,var(--linie));border-radius:12px;padding:12px;margin:8px 0}
.item.appt{background:var(--leise);border-left-color:var(--tinte2)}
.tt{font-weight:600}
.chk{width:30px;height:30px;border-radius:8px;border:2px solid var(--linie);background:var(--blatt);flex-shrink:0;cursor:pointer}
/* Knöpfe */
button{font:inherit;cursor:pointer;color:inherit}
.btn{border:1px solid var(--linie);background:var(--blatt);color:var(--tinte);border-radius:10px;padding:8px 14px;font:500 15px/1.2 var(--text);text-decoration:none;display:inline-block}
.btn.sm{padding:5px 10px;font-size:14px}
.btn.primary{background:var(--fill);border-color:var(--fill);color:var(--on);font-weight:600}
.btn.big{font-size:18px;padding:12px 18px}
.btn.on{background:var(--tinte);border-color:var(--tinte);color:var(--blatt)}
.btn.danger{color:var(--er)}
.btn.ghost{border-color:transparent;background:none;color:var(--tinte2);padding-left:0}
.btn:focus-visible,.tab:focus-visible,.seg button:focus-visible,.day:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.more{display:flex;flex-wrap:wrap;gap:4px 18px;margin:18px 2px 0}
.more .btn{padding:6px 0;border:0;background:none;color:var(--tinte2);text-decoration:underline;text-underline-offset:3px}
.fb{margin-top:14px;padding-top:12px;border-top:1px solid var(--linie)}
.fb .q{font-size:15px;margin:8px 0 6px}
/* Formulare */
label{display:block;font-size:14px;color:var(--tinte2);margin:10px 0 0}
input,select,textarea{display:block;width:100%;max-width:100%;min-width:0;font:16px/1.3 var(--text);padding:9px 11px;margin-top:4px;border:1px solid var(--linie);border-radius:10px;background:var(--blatt);color:var(--tinte)}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;min-height:42px;text-align:left}
input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value{text-align:left}
input[type=checkbox]{display:inline;width:auto;min-height:0;margin:0 8px 0 0;accent-color:var(--tinte)}
label:has(>input[type=checkbox]){color:var(--tinte);font-size:15px;display:flex;align-items:center}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.g5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.g2>label,.g5>label{min-width:0}
@media (max-width:480px){.g2{grid-template-columns:minmax(0,1fr);gap:0}.g5{grid-template-columns:repeat(3,minmax(0,1fr))}}
/* Hinweise */
.note{font-size:14px;padding:10px 12px;border-radius:10px;background:var(--acbg);color:var(--ac);margin:10px 0}
.warn{background:var(--wabg);color:var(--wa)}.err{background:var(--erbg);color:var(--er)}.okn{background:var(--okbg);color:var(--ok)}
/* Elternbereich: Umschalter */
.seg{display:flex;gap:4px;background:var(--blatt);border:1px solid var(--linie);border-radius:12px;padding:4px;margin:12px 0 4px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:9px 2px;font:500 14px/1.1 var(--text);color:var(--tinte2)}
.seg button.on{background:var(--tinte);color:var(--blatt);font-weight:600}
.seg .cnt{display:inline-block;min-width:18px;padding:1px 5px;border-radius:9px;background:var(--er);color:#fff;font-size:11px;font-weight:600;margin-left:2px}
details.card summary{cursor:pointer;list-style:none}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:'›';float:right;font-size:22px;line-height:20px;color:var(--tinte2);transition:transform .2s}
details.card[open] summary::after{transform:rotate(90deg)}
details.card[open] summary{margin-bottom:8px}
/* Einstellungen als Zeilen */
.sh{margin:18px 0 2px;color:var(--tinte2);font-size:14px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0;padding:10px 0;border-top:1px solid var(--linie);color:var(--tinte);font-size:15px}
.sh+.srow{border-top:0}
.srow>span:first-child{flex:1;min-width:0}
.srow small{display:block;font-size:13px;color:var(--tinte2);margin-top:2px}
.srow .iv{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.srow .iv input,.srow .iv select{width:96px;margin:0;padding:7px 9px;text-align:right}
.srow .iv input[type=time]{width:116px}
.srow .iv em{font-style:normal;font-size:14px;color:var(--tinte2);min-width:30px}
.srow.col{flex-direction:column;align-items:stretch;gap:6px}
.srow.col input,.srow.col select{margin:0}
input.tg{-webkit-appearance:none;appearance:none;width:46px;height:28px;border-radius:14px;background:var(--linie);position:relative;flex:0 0 auto;margin:0;cursor:pointer;transition:background .15s}
input.tg::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s}
input.tg:checked{background:var(--ok)}
input.tg:checked::after{left:21px}
input.tg:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
/* Kennzahlen */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:4px 0 2px}
.stats .v{font:700 34px/1 var(--anz)}
.stats .v small{font:600 16px var(--text);color:var(--tinte2)}
.stats .sub{margin-top:4px;font-size:13px}
/* Stundenplan */
.days5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:6px 0 10px}
.days5 .day{min-width:0;padding:7px 2px}
.ttrow{display:grid;grid-template-columns:22px 48px minmax(0,1fr);gap:8px;align-items:center;padding:4px 0}
.ttrow .n{font:700 17px/1 var(--anz);text-align:right}
.ttrow .tm{font-size:13px;color:var(--tinte2)}
.ttrow select{margin:0;padding:7px 10px;color:var(--tinte2)}
.ttrow select.set{color:var(--tinte);font-weight:500;background:var(--leise)}
.ttimes{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr);gap:6px 10px;align-items:center;margin-top:10px}
.ttimes input{margin:0}
details.grp summary{cursor:pointer;list-style:none}
details.grp summary::-webkit-details-marker{display:none}
details.grp summary::after{content:'›';float:right;font-size:22px;line-height:20px;color:var(--tinte2);transition:transform .2s}
details.grp[open] summary::after{transform:rotate(90deg)}
details.grp[open] summary{margin-bottom:6px}
/* Woche */
.bar{height:6px;background:var(--leise);border-radius:3px;overflow:hidden;margin:8px 0 4px}
.bar div{height:100%;background:var(--tinte2)}
.bar div.full{background:var(--wa)}
.prog{height:6px;background:var(--leise);border-radius:3px;overflow:hidden;margin:6px 0 2px}
.prog div{height:100%;background:var(--ok)}
/* Pokale */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.badge{border:1px solid var(--linie);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--tinte2);overflow-wrap:break-word;min-width:0}
.badge.off{color:var(--tinte2)}
.badge.off b{color:var(--tinte2)}
.badge .bdone{display:inline-block;margin-top:6px;font-size:12px;font-weight:600;color:var(--tinte);background:var(--leise);border-radius:999px;padding:2px 8px}
.badge .bprog{display:block;height:5px;border-radius:3px;background:var(--leise);margin-top:8px;overflow:hidden}
.badge .bprog i{display:block;height:100%;background:var(--tinte)}
.badge .bcnt{display:block;font-size:12px;margin-top:3px}
.rules{margin:0 0 8px;padding-left:22px;display:grid;gap:8px;font-size:15px;line-height:1.4}
.rules b{font-family:var(--anz);font-size:16px}
.badge b{display:block;font:700 17px/1.2 var(--anz);color:var(--tinte)}
.jgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.jer{display:flex;flex-direction:column;align-items:center;gap:2px;height:152px;background:var(--leise);border:2px solid transparent;border-radius:14px;color:var(--tinte);padding:10px 4px 8px}
.jer svg{width:56px;height:72px;flex:0 0 auto;margin-bottom:4px}
.jer .jn{font:700 16px/1.1 var(--anz)}
.jer .js.lg{font-size:12px;white-space:normal;line-height:1.15;text-align:center}
.jer .js{font-size:12px;color:var(--tinte2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.jer.on{border-color:var(--tinte);background:var(--blatt)}
.jer.lock{cursor:default}
.jer.lock svg{filter:grayscale(1);opacity:.35}
.jer.lock .jn{color:var(--tinte2)}
pre.rep{white-space:pre-wrap;font:15px/1.5 var(--text);margin:0}
#toast{position:fixed;left:50%;top:80px;transform:translateX(-50%);background:var(--tafel);color:#fff;padding:14px 26px;border-radius:16px;font:700 30px/1 var(--anz);text-align:center;z-index:9;animation:pop 2.4s ease forwards;pointer-events:none;border-bottom:4px solid var(--fill)}
#toast small{display:block;font:500 14px/1.3 var(--text);margin-top:4px;color:#D6E3E7}
@keyframes pop{0%{opacity:0;transform:translate(-50%,10px) scale(.85)}12%{opacity:1;transform:translate(-50%,0) scale(1.05)}20%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){#toast{animation:none}details.card summary::after{transition:none}}
</style>
</head>
<body>
<header>
  <div><div class="brand">Lernplaner</div><div class="hdr-sub" id="today"></div></div>
  <div class="hdr-r"><span class="sync" id="sync" title=""></span><a href="index.html">Familienplan</a></div>
</header>
<main id="app"></main>
<nav class="tabs" aria-label="Bereiche"><div class="in">
  <button class="tab" data-act="tab" data-v="heute"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span>Heute</span><span class="pip"></span></button>
  <button class="tab" data-act="tab" data-v="woche"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg><span>Woche</span><span class="pip"></span></button>
  <button class="tab" data-act="tab" data-v="pokale"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4h10v4a5 5 0 0 1-10 0V4z"/><path d="M7 6H4.5v1.5A3 3 0 0 0 7.5 10.5M17 6h2.5v1.5a3 3 0 0 1-3 3M12 13v4M8.5 20h7"/></svg><span>Pokale</span><span class="pip"></span></button>
  <button class="tab" data-act="tab" data-v="eltern"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3"/><circle cx="16.5" cy="9.5" r="2.3"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0M14 19a4 4 0 0 1 7 0"/></svg><span>Eltern</span><span class="pip"></span></button>
</div></nav>
<script>
/* ===== Konfiguration: kommt aus js/config.js der Familien-App ===== */
const FCFG=window.ESSENSPLAN_CONFIG||{};
const REMOTE=!!(FCFG.supabaseUrl&&FCFG.supabaseKey);
let sb=null,authOk=true,kids=[];
const CACHE_KEY=REMOTE?'lernplaner-web-v1':'lernplaner-v1';

const SUBJ=['Mathe','Deutsch','Englisch','Latein','Biologie','Physik','Natur und Technik','Geschichte','Geographie','Wirtschaft','Religion/Ethik','Musik','Kunst','Sonstiges'];
const COL={Mathe:'#378ADD',Deutsch:'#D85A30',Englisch:'#1D9E75',Latein:'#7F77DD',Biologie:'#639922',Physik:'#BA7517','Natur und Technik':'#97C459',Geschichte:'#993C1D',Geographie:'#0F6E56',Wirtschaft:'#5F5E5A','Religion/Ethik':'#534AB7',Musik:'#D4537E',Kunst:'#ED93B1',Sonstiges:'#888780'};
const WD=['So','Mo','Di','Mi','Do','Fr','Sa'];
const WDL=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const EXAM={'Schulaufgabe':[[-8,30],[-6,30],[-4,30],[-3,30],[-2,35],[-1,20]],'Kurzarbeit':[[-4,20],[-2,25],[-1,15]],'Ex / Test':[[-3,20],[-2,20],[-1,15]],'Referat':[[-10,30],[-7,30],[-4,30],[-2,30],[-1,20]]};
// Rund 5 Tore pro Schultag: Bundesliga nach etwa 14 Wochen, Europapokal nach etwa 18.
const LIGA=[['Kreisliga',0],['Bezirksliga',20],['Bezirksoberliga',50],['Landesliga',90],['Bayernliga',140],['3. Liga',200],['2. Bundesliga',270],['1. Bundesliga',350],['Europapokal',450]];
// Trikots: Shirt, Kragen und Ärmelränder, Hose. Coburg gelb-schwarz (Vereinsfarben), Kiel weiß mit schwarzen Streifen („Zebras“).
const THEMES=[
  {n:'Coburg',d:'Heim',m:'#F5C400',on:'#111111',s:'#111111',shirt:'#F5C400',trim:'#111111',shorts:'#111111',lvl:0},
  {n:'Blau',d:'',m:'#1E5FA8',on:'#ffffff',s:'#ffffff',shirt:'#1E5FA8',trim:'#ffffff',shorts:'#ffffff',lvl:1},
  {n:'Rot',d:'',m:'#C0322B',on:'#ffffff',s:'#ffffff',shirt:'#C0322B',trim:'#ffffff',shorts:'#ffffff',lvl:2},

function records(){

function fromRecords(r){
  const s=blank();
  Object.values(r).forEach(({coll,data})=>{

let synced={},syncedColl={},lastPull=null,pushT=null,pushing=false;
function writeCache(){try{localStorage.setItem(CACHE_KEY,JSON.stringify(REMOTE?{S,synced,syncedColl,lastPull}:S))}catch(e){}}
function readCache(){try{const x=JSON.parse(localStorage.getItem(CACHE_KEY));if(!x)return null;if(REMOTE){synced=x.synced||{};syncedColl=x.syncedColl||{};lastPull=x.lastPull||null;return migrate(x.S)}return migrate(x)}catch(e){return null}}

async function push(){
  if(!REMOTE||!sb||!authOk)return;
  if(pushing){clearTimeout(pushT);pushT=setTimeout(push,800);return}
  pushing=true;
  try{
    const local=records(),up=[];
    for(const id in local){const j=JSON.stringify(local[id].data);if(synced[id]!==j)up.push({id,coll:local[id].coll,data:local[id].data,deleted:false})}
    for(const id in synced)if(!local[id])up.push({id,coll:syncedColl[id]||'x',data:null,deleted:true});
    for(let i=0;i<up.length;i+=200){
      const part=up.slice(i,i+200);
      const{error}=await sb.from('lp_data').upsert(part,{onConflict:'id'});if(error)throw error;
      part.forEach(u=>{if(u.deleted){delete synced[u.id];delete syncedColl[u.id]}else{synced[u.id]=JSON.stringify(u.data);syncedColl[u.id]=u.coll}});
    }
    ui.sync='ok';
  }catch(e){ui.sync='err';console.warn(e)}
  pushing=false;writeCache();syncDot();
}
async function pull(full,fresh){
  if(!REMOTE||!sb)return false;
  const rows=[];
  for(let off=0;;off+=1000){
    let q=sb.from('lp_data').select('id,coll,data,deleted,updated_at').order('updated_at',{ascending:true}).order('id',{ascending:true});
    if(full)q=q.eq('deleted',false);
    else if(lastPull)q=q.gt('updated_at',new Date(new Date(lastPull).getTime()-5000).toISOString());
    const{data,error}=await q.range(off,off+999);if(error)throw error;
    rows.push(...data);if(data.length<1000)break;
  }
  const local=records();
  const dirty=new Set(fresh&&rows.length?[]:Object.keys(local).filter(id=>JSON.stringify(local[id].data)!==synced[id]));
  if(!fresh)Object.keys(synced).forEach(id=>{if(!local[id])dirty.add(id)});
  let base,changed=false;
  if(full){
    base={};dirty.forEach(id=>{if(local[id])base[id]=local[id]});
    const seen=new Set(rows.map(r=>r.id));
    Object.keys(synced).forEach(id=>{if(!seen.has(id)&&!dirty.has(id)){delete synced[id];delete syncedColl[id]}});
    changed=true;
  }else base=local;
  rows.forEach(r=>{
    if(!lastPull||r.updated_at>lastPull)lastPull=r.updated_at;
    if(dirty.has(r.id))return;
    if(r.deleted){if(base[r.id]){delete base[r.id];changed=true}delete synced[r.id];delete syncedColl[r.id];return}
    const j=JSON.stringify(r.data);
    if(!base[r.id]||JSON.stringify(base[r.id].data)!==j)changed=true;
    base[r.id]={coll:r.coll,data:r.data};synced[r.id]=j;syncedColl[r.id]=r.coll;
  });
  if(changed)S=fromRecords(base);
  ui.sync='ok';writeCache();
  return changed;
}

function factor(t){const p=S.pace;let f=1;
  if(p[paceKey(t)]&&p[paceKey(t)].n>=2)f=p[paceKey(t)].f;else if(p[t.subject]&&p[t.subject].n>=2)f=p[t.subject].f;else if(p._all)f=p._all.f;

  const T=iso(today()),m=S.model;let ch=false;
  Object.keys(S.days).sort().forEach(d=>{const r=S.days[d];if(d>=T||r.eval)return;
    const dd=parse(d);ch=true;r.eval=true;if(!isWeekday(dd))return;

      else if(!won&&r.planned>=m.cap*.8&&done<r.planned){m.cap=Math.max(40,m.cap-5);r.capChange=-5}

function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=(t.getUTCDay()+6)%7;t.setUTCDate(t.getUTCDate()-n+3);const f=new Date(Date.UTC(t.getUTCFullYear(),0,4));return 1+Math.round(((t-f)/864e5-3+((f.getUTCDay()+6)%7))/7)}
function ttNew(){return{times:TT_TIMES.map(x=>x.slice()),timesOk:true,ab:true,refWeek:iso(monday(today())),refType:'B',A:{},B:{}}}
function ttFilled(p){return!!p&&[1,2,3,4,5].some(w=>(p[w]||[]).some(Boolean))}
function weekType(d){const tt=S.timetable;if(!tt||!tt.ab)return'A';const diffW=Math.round((monday(d)-parse(tt.refWeek))/(7*864e5));return Math.abs(diffW)%2===0?tt.refType:(tt.refType==='A'?'B':'A')}
// Plan für einen Tag. Ist eine der beiden Wochen noch leer, gilt die andere.
function lessonsOn(d){const tt=S.timetable;if(!tt||!isWeekday(d))return[];const t=weekType(d);let p=tt[t];if(!ttFilled(p))p=tt[t==='A'?'B':'A'];const w=d.getDay();let l=(p&&p[w])||[];if(!l.some(Boolean)&&tt.ab){const o=tt[t==='A'?'B':'A'];if(o&&o[w])l=o[w]}return l}
function schoolEndMin(d){const l=lessonsOn(d),tt=S.timetable;let last=-1;l.forEach((x,i)=>{if(x)last=i});if(last<0||!tt)return null;const tm=tt.times[last];return tm?toMin(tm[1]):null}
function nextLesson(subject){if(!S.timetable)return schoolDayIn(1);for(let i=1;i<=21;i++){const d=addDays(today(),i);if(!isWeekday(d)||freeReason(d))continue;if(lessonsOn(d).includes(subject))return iso(d)}return schoolDayIn(1)}

/* ===== Planung ===== */
function apptsFor(d){const di=iso(d),wd=d.getDay();return S.appts.filter(a=>+a.weekday===wd).concat(S.oneoffs.filter(a=>a.date===di)).sort((a,b)=>a.start.localeCompare(b.start))}
function isFree(d){return(d.getDay()===0&&S.settings.sundayFree)||(S.settings.holidaysFree!==false&&!!freeReason(d))}
function dayStart(d){if(!isWeekday(d)||freeReason(d))return toMin(S.settings.weekendStart);const e=schoolEndMin(d);return(e!=null?e:toMin(S.schoolEnd[d.getDay()]||'13:00'))+(+S.settings.afterSchool)}
function windowsFor(d,isToday){
  const st=S.settings,appts=apptsFor(d);
  if(isFree(d))return{wins:[],appts,free:true};
  let start=dayStart(d);const end=toMin(st.latest);
  if(isToday)start=Math.max(start,Math.ceil(nowMin()/5)*5);
  let wins=start<end?[[start,end]]:[];
  appts.forEach(a=>{const a0=toMin(a.start)-st.buffer,a1=toMin(a.end)+st.buffer;
    wins=wins.flatMap(([s,e])=>{const o=[];if(a0>s)o.push([s,Math.min(e,a0)]);if(a1<e)o.push([Math.max(s,a1),e]);return o}).filter(([s,e])=>e-s>=10)});
  return{wins,appts,free:false};
}
function alloc(cap,P){
  const bm=+S.settings.blockMax,pz=+S.settings.pause,c=cap.map(w=>w.slice()),segs=[];let rem=P;
  for(const w of c){while(rem>0&&w[1]-w[0]>=Math.min(rem,10)){const len=Math.min(rem,bm,w[1]-w[0]);segs.push([w[0],w[0]+len]);w[0]=Math.min(w[1],w[0]+len+pz);rem-=len}if(rem<=0)break}
  if(rem>0)return null;cap.splice(0,cap.length,...c.filter(w=>w[1]-w[0]>0));return segs;
}
function simulate(){
  const t0=today(),T=iso(t0),out=[],placed=new Set(),exD={};
  S.exams.forEach(e=>exD[e.id]=e.date);
  const open=S.tasks.filter(t=>!t.done&&!(t.examId&&(exD[t.examId]||'')<=T));
  const byDue=(a,b)=>a.due.localeCompare(b.due);
  const doneToday=S.tasks.filter(t=>t.done&&t.doneAt===T).reduce((a,t)=>a+(t.planned||0),0);
  for(let i=0;i<14;i++){
    const d=addDays(t0,i),di=iso(d);
    let nx=addDays(d,1);if(isFree(nx))nx=addDays(nx,1);const nextWork=iso(nx);
    const{wins,appts,free}=windowsFor(d,i===0),cap=wins.map(w=>w.slice()),lim=dayLimit(d),base=i===0?doneToday:0;
    const day={date:di,appts,free,items:[],over:[],capMin:wins.reduce((a,[s,e])=>a+e-s,0),used:0,lim};
    const ha=open.filter(t=>t.kind==='ha'&&!placed.has(t.id));
    const urgent=ha.filter(t=>t.due<=nextWork).sort(byDue);
    const daily=open.filter(t=>t.kind==='daily'&&t.date===di);
    const lern=open.filter(t=>t.kind==='lern'&&!placed.has(t.id)&&t.date<=di).sort((a,b)=>(exD[a.examId]||'').localeCompare(exD[b.examId]||''));
    const rest=ha.filter(t=>t.due>nextWork).sort(byDue);
    const place=(t,must)=>{const P=planMin(t);
      if(!must&&base+day.used+P>lim)return;
      const segs=alloc(cap,P);
      if(segs){day.items.push({t,segs,P});day.used+=P;placed.add(t.id)}
      else if(must){day.over.push({t,P});placed.add(t.id)}};
    urgent.forEach(t=>place(t,true));
    daily.forEach(t=>place(t,true));
    lern.forEach(t=>place(t,exD[t.examId]<=nextWork||t.date<di));
    rest.forEach(t=>place(t,false));
    day.items.sort((a,b)=>a.segs[0][0]-b.segs[0][0]);
    out.push(day);
  }
  return out;
}
function queueOf(day){
  const q=day.items.map(i=>({t:i.t,P:i.P,segs:i.segs})).concat(day.over.map(o=>({t:o.t,P:o.P,segs:null,over:true})));
  q.sort((a,b)=>((b.t.kind==='daily')-(a.t.kind==='daily'))||((a.segs?a.segs[0][0]:9999)-(b.segs?b.segs[0][0]:9999)));
  return q;
}

function weekInfo(){

function badges(){
  const wins=Object.keys(S.wins).filter(d=>S.wins[d]).sort();
  let streak=0,best=0,prev=null;
  wins.forEach(d=>{let p=addDays(parse(d),-1);while(!isWeekday(p))p=addDays(p,-1);streak=(prev===iso(p))?streak+1:1;best=Math.max(best,streak);prev=d});
  const cnt=w=>S.goals.filter(g=>g.why===w).length;
  const weeks={};wins.forEach(d=>{if(isWeekday(parse(d))){const k=iso(monday(parse(d)));weeks[k]=(weeks[k]||0)+1}});
  const wg=+S.settings.winGoal||4,exDone=S.exams.some(e=>{const ts=S.tasks.filter(t=>t.examId===e.id);return ts.length&&ts.every(t=>t.done)});

  return[

    ['Wochensieger','Ein Wochenspiel gewinnen',Object.values(weeks).some(n=>n>=wg)?1:0,1],

    ['Ludus-Profi','10-mal Ludus Latinus gespielt',Math.min(10,S.tasks.filter(t=>t.kind==='daily'&&t.done).length),10],
    ['Kabinen-Chef','7-mal den Vokabel-Check gemacht',Math.min(7,Object.keys(S.checks).filter(d=>CHECKS.every(([k])=>S.checks[d][k])).length),7],
    ['Gut vorbereitet','Alle Lerneinheiten vor einer Prüfung geschafft',exDone?1:0,1],

}

function finish(id){
  const t=S.tasks.find(x=>x.id===id);if(!t)return;
  const P=planMin(t);let actual;
  if(S.running&&S.running.id===id){actual=Math.max(1,Math.round((Date.now()-S.running.at)/60000));S.running=null}
  else actual=Math.round(P*({kurz:.7,ok:1,lang:1.4}[ui.fbDur]));

function shrink(file){return new Promise(res=>{
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{const k=Math.min(1,2000/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url);c.toBlob(b=>res(b||file),'image/jpeg',.85)};
  img.onerror=()=>{URL.revokeObjectURL(url);res(file)};img.src=url;
})}

Schreibe auf Deutsch, sachlich und freundlich, höchstens 170 Wörter, ohne Gedankenstriche und ohne Floskeln:

Wenn es noch zu wenig Daten gibt, sag das kurz und nenne, worauf die Eltern in den nächsten Tagen achten sollten.`);

function scoreboard(kick){
  const T=iso(today()),w=weekInfo(),L=liga(),bt=+S.settings.bedtimeMin||30,tw=toWin();
  let prize;
  if(w.prize)prize=w.redeemed?'Siegprämie eingelöst. Neues Spiel ab Montag.':`Wochenspiel gewonnen! Freitag und Samstag je ${bt} Min. länger aufbleiben.`;
  else if(w.possible)prize=`Wochenspiel: noch ${w.goal-w.won} Tagessieg${w.goal-w.won>1?'e':''}, dann darfst du Freitag und Samstag ${bt} Min. länger aufbleiben.`;
  else prize='Für die Siegprämie reicht es diese Woche nicht mehr. Am Montag geht es neu los.';
  return `<section class="board" aria-label="Spielstand">
  <div class="b-top"><div><div class="b-lab">Tore heute</div><div class="b-num">${goalsOn(T)}</div>${tw?`<div class="b-lab">Noch ${tw} bis zum Tagessieg</div>`:''}</div>

  <div class="b-week">${w.days.map((d,i)=>{const fr=isFree(parse(d));return `<div class="${S.wins[d]?'won':fr?'':d<T?'lost':''} ${d===T?'now':''}">${['Mo','Di','Mi','Do','Fr'][i]}<b>${S.wins[d]?'Sieg':fr?'frei':d<T?'0':'&nbsp;'}</b></div>`}).join('')}</div>

}

  }else if(!day.free){

  return h+addButtons(true);

async function scanTimetable(){
  const inp=document.getElementById('ttfile'),files=[...((inp&&inp.files)||[])];
  if(!files.length){ui.msg='Bitte zuerst einen Screenshot auswählen.';ui.msgType='err';render();return}
  ui.busy='tt';render();
  try{
    const imgs=await Promise.all(files.slice(0,2).map(shrink));
    const res=await aiJSON(`Das ist ein Screenshot der Stundenplan-Wochenansicht aus Schulmanager Online (7. Klasse, Gymnasium in Bayern).
Lies den regulären Stundenplan ab. Zeilen sind die Stunden 1 bis 11, Spalten Montag bis Freitag.
- Jede Zelle: genau eines dieser Fächer, sonst "": ${TT_SUBJ.join(', ')}. Kürzel: D Deutsch, M Mathe, E Englisch, L Latein, NuT Natur und Technik, B Biologie, Ph Physik, G Geschichte, Geo Geographie, WR Wirtschaft, K/Ev/Eth Religion/Ethik, Mu Musik, Ku Kunst, Sm/Sw/Sp Sport, Ins Intensivierung, Blas Bläserklasse.
- Durchgestrichene, ausgefallene oder vertretene Stunden zählen wie normaler Unterricht im ursprünglichen Fach. Lehrerkürzel und Räume ignorieren.
- Ist an einem Tag gar kein regulärer Unterricht zu sehen (Feiertag, Ferien, ganztags grau), setze den Tag auf null.
- "woche": "A" oder "B", wenn A-Woche oder B-Woche auf dem Bild steht, sonst "".
- "montag": Datum des Montags als JJJJ-MM-TT, wenn erkennbar, sonst "".
Antworte nur mit JSON: {"woche":"B","montag":"2026-11-16","tage":{"1":["Geschichte","Deutsch",""],"2":[...],"3":null,"4":[...],"5":[...]}}`,imgs);
    const tt=S.timetable||ttNew(),typ=/^[AB]$/.test(res.woche||'')?res.woche:(ui.ttType||weekType(today()));
    if(/^[AB]$/.test(res.woche||'')&&/^\d{4}-\d{2}-\d{2}$/.test(res.montag||'')){tt.refWeek=iso(monday(parse(res.montag)));tt.refType=res.woche;tt.ab=true}
    const plan=Object.assign({},tt[typ]);let n=0;
    for(const w of [1,2,3,4,5]){const day=res.tage&&res.tage[String(w)];if(!Array.isArray(day))continue;
      const clean=day.slice(0,tt.times.length).map(x=>TT_SUBJ.includes(x)?x:(x?'Sonstiges':''));while(clean.length&&!clean[clean.length-1])clean.pop();
      if(clean.length){plan[w]=clean;n++}}
    tt[typ]=plan;S.timetable=tt;ui.ttType=typ;save();
    ui.msg=n?`${typ}-Woche übernommen (${n} Tage). Bitte kurz prüfen.`:'Auf dem Screenshot war kein Stundenplan zu erkennen.';ui.msgType=n?'okn':'err';
  }catch(e){ui.msg=aiError(e);ui.msgType='err'}
  ui.busy=null;render();
}

  <div class="row" style="margin-top:16px"><button class="btn primary">Speichern</button></div></form>`;
  sec.einst+=`<div class="card"><h2>Daten</h2><div class="row">${S.meta.sample?'<button class="btn danger" data-act="clearsample">Beispieldaten löschen</button>':''}<button class="btn" data-act="lock">Elternbereich schließen</button></div>
  <div class="sub" style="margin-top:8px">${REMOTE?'Alles wird in der Datenbank des Familienplans gespeichert und auf allen Geräten abgeglichen. Den Stand seht ihr auch im Familienplan unter „Aufgaben“.':'Diese Version speichert nur in diesem Browser.'}</div></div>`;
  const cur=ui.esec||'ueb';
  const nav=[['ueb','Überblick',S.help.length],['ein','Eintragen',0],['schule','Schule',0],['einst','Optionen',0]];
  return `<div class="seg">${nav.map(([k,l,n])=>`<button class="${cur===k?'on':''}" data-act="esec" data-v="${k}">${l}${n?` <span class="cnt">${n}</span>`:''}</button>`).join('')}</div>`+msgBox()+sec[cur];
}

/* ===== Rendern ===== */
function render(){
  let ch=ensureDaily();
  if(evaluateDays())ch=true;
  const plan=simulate(),T=iso(today());
  if(!plan[0].free){const tot=plan[0].used+plan[0].over.reduce((a,o)=>a+o.P,0)+S.tasks.filter(t=>t.done&&t.doneAt===T).reduce((a,t)=>a+(t.planned||0),0);
    const cur=S.days[T]||{};if(!cur.planned||tot>cur.planned){S.days[T]=Object.assign({},cur,{planned:tot});ch=true}}
  if(ch)save();
  const th=THEMES[S.settings.theme]||THEMES[0],rs=document.documentElement.style;
  rs.setProperty('--fill',th.m);rs.setProperty('--on',th.on);rs.setProperty('--stripe',th.s);
  {const hx=th.m.replace('#',''),lum=(0.299*parseInt(hx.slice(0,2),16)+0.587*parseInt(hx.slice(2,4),16)+0.114*parseInt(hx.slice(4,6),16));rs.setProperty('--hl',lum<90?th.s:th.m)}
  document.getElementById('today').textContent=WDL[today().getDay()]+', '+today().getDate()+'. '+['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'][today().getMonth()];
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.v===ui.tab));
  document.getElementById('app').innerHTML=ui.tab==='heute'?renderHeute(plan):ui.tab==='woche'?renderWoche(plan):ui.tab==='pokale'?renderPokale():renderEltern(plan);
  syncDot();
  if(toastQ){const old=document.getElementById('toast');if(old)old.remove();
    const d=document.createElement('div');d.id='toast';d.innerHTML=`+${toastQ.n} ${toastQ.n===1?'Tor':'Tore'}<small>${esc(toastQ.why)}</small>`;
    document.body.appendChild(d);setTimeout(()=>d.remove(),2500);toastQ=null}
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id;
  const t=id&&S.tasks.find(x=>x.id===id);
  switch(a){
    case'tab':ui.tab=b.dataset.v;ui.fb=null;ui.full=false;ui.day=0;ui.sub='';window.scrollTo(0,0);break;
    case'day':ui.day=+b.dataset.i;ui.fb=null;break;
    case'full':ui.full=!ui.full;ui.day=0;ui.fb=null;break;
    case'focus':ui.focus=id;ui.fb=null;window.scrollTo(0,0);break;
    case'kick':{const T=iso(today()),w=windowsFor(today(),false).wins;S.kick[T]=hm(nowMin());if(w.length&&nowMin()<=w[0][0]+15)award(PTS.kick,'Pünktlicher Anpfiff');save();break}
    case'vchk':answerCheck(b.dataset.k,b.dataset.v==='1');break;
    case'check':ui.fb=id;ui.fbDur='ok';ui.fbFeel='mittel';break;
    case'fbdur':ui.fbDur=b.dataset.v;break;
    case'fbfeel':ui.fbFeel=b.dataset.v;break;
    case'fbsave':finish(ui.fb);break;
    case'fbcancel':ui.fb=null;break;
    case'start':S.running={id,at:Date.now()};if(!S.kick[iso(today())])S.kick[iso(today())]=hm(nowMin());save();break;
    case'undo':if(t){const d=t.doneAt;t.done=false;S.goals=S.goals.filter(g=>g.taskId!==id);if(S.wins[d])delete S.wins[d];save()}break;
    case'rv':ui.rv[id]=Object.assign({},ui.rv[id],{[b.dataset.k]:b.dataset.v});break;
    case'rvsave':{const r=ui.rv[id]||{},e=S.exams.find(x=>x.id===id);if(!e)break;
      if(!r.feel||!r.prep){ui.msg='Bitte beide Fragen beantworten.';ui.msgType='err';break}
      S.results.push({id:uid(),examId:id,subject:e.subject,type:e.type,date:e.date,feel:r.feel,prep:r.prep});
      applyResult(e,r.feel,r.prep);award(PTS.review,'Spielanalyse');delete ui.rv[id];save();break}
    case'meet':S.meets[b.dataset.k]=iso(today());award(PTS.meet,'Mannschaftsbesprechung');save();break;
    case'toggleha':ui.addHA=!ui.addHA;ui.scanOpen=false;break;
    case'del':S.tasks=S.tasks.filter(x=>x.id!==id);save();break;
    case'est':if(t){t.est=Math.max(5,Math.min(120,t.est+(+b.dataset.v)));save()}break;
    case'edit':ui.edit=id;break;
    case'editx':ui.edit=null;break;
    case'grade':ui.edit='g-'+id;break;
    case'delexam':S.exams=S.exams.filter(x=>x.id!==id);S.tasks=S.tasks.filter(x=>x.examId!==id);save();break;
    case'refine':if(!ui.busy)refineExam(id);return;
    case'toc':if(!ui.busy)scanToc(id);return;
    case'report':if(!ui.busy)makeReport();return;
    case'delbook':S.books=S.books.filter(x=>x.id!==id);save();break;
    case'delappt':S.appts=S.appts.filter(x=>x.id!==id);S.oneoffs=S.oneoffs.filter(x=>x.id!==id);save();break;
    case'helpdone':S.help=S.help.filter(x=>x.id!==id);save();break;
    case'redeem':S.prizes[weekInfo().key]='eingelöst';save();break;
    case'theme':S.settings.theme=+b.dataset.i;save();break;
    case'lock':ui.unlocked=false;ui.sub='';break;
    case'sub':ui.sub=b.dataset.v;window.scrollTo(0,0);break;
    case'esec':ui.esec=b.dataset.v;ui.sub='';window.scrollTo(0,0);break;
    case'learnopen':ui.learnOpen=!ui.learnOpen;return;
    case'ttsuggest':{const tt=ttNew();tt.refWeek=TT_SUGGEST.week;tt.refType=TT_SUGGEST.type;tt.B=JSON.parse(JSON.stringify(TT_SUGGEST.days));S.timetable=tt;ui.ttType='B';ui.ttDay=3;save();ui.msg='Übernommen. Bitte noch den Mittwoch eintragen und die Uhrzeiten prüfen.';ui.msgType='okn';break}
    case'ttempty':S.timetable=ttNew();save();break;
    case'tttype':ui.ttType=b.dataset.v;break;
    case'ttday':ui.ttDay=+b.dataset.v;break;
    case'ttscan':if(!ui.busy)scanTimetable();return;
    case'scanopen':ui.scanOpen=true;ui.addHA=false;break;
    case'scancancel':ui.scan={status:'idle'};ui.scanOpen=false;break;
    case'scanrun':runScan();return;
    case'clearsample':{const keep={settings:S.settings,schoolEnd:S.schoolEnd,appts:S.appts,oneoffs:S.oneoffs,books:S.books};S=Object.assign(migrate(blank()),keep);S.meta={sample:false,setup:true};save();ui.msg='Beispieldaten gelöscht. Termine und Einstellungen bleiben erhalten, bitte prüfen.';break}
    default:return;
  }
  render();
});

document.addEventListener('submit',e=>{
  const f=e.target;if(!f.dataset.form)return;e.preventDefault();
  const v=Object.fromEntries(new FormData(f));
  switch(f.dataset.form){
    case'tt':{const tt=Object.assign({},S.timetable||ttNew());
      tt.times=tt.times.map((tm,i)=>[v['s'+i]||tm[0],v['e'+i]||tm[1]]);tt.timesOk=true;
      tt.ab=!!v.ab;tt.refWeek=iso(monday(today()));tt.refType=v.ref==='A'?'A':'B';
      S.timetable=tt;ui.msg='Stundenplan-Einstellungen gespeichert.';ui.msgType='okn';break}
    case'pin':if(v.pin===S.settings.pin)ui.unlocked=true;else{ui.msg='Die PIN stimmt nicht.';ui.msgType='err'}break;
    case'ha':if(!v.title.trim())return;addHA(v.subject,v.title.trim(),v.due,v.est);ui.addHA=false;ui.msg='Hausaufgabe gespeichert und eingeplant.';break;
    case'scanok':{
      let n=0;(ui.scan.items||[]).forEach((it,i)=>{if(!v['on'+i])return;const title=(v['t'+i]||'').trim();if(!title)return;
        const sub=v['s'+i]||it.subject,due=v['d'+i]||it.due;if(isDup(sub,title,due))return;addHA(sub,title,due,+v['m'+i]||it.est);n++});
      ui.scan={status:'idle'};ui.scanOpen=false;ui.msg=n?`${n} Hausaufgabe${n>1?'n':''} übernommen und eingeplant.`:'Keine neuen Hausaufgaben übernommen.';break}
    case'exam':{if(!v.date)return;const id=addExam(v.subject,v.type,v.date,v.topic.trim());ui.msg=`${v.subject} ${v.type} gespeichert. Die Lerneinheiten sind verteilt.`;ui.msgType='okn';save();if(AI_OK()){refineExam(id);return}break}
    case'edit':{const t=S.tasks.find(x=>x.id===f.dataset.id);if(t&&v.title.trim())t.title=v.title.trim();ui.edit=null;break}
    case'grade':{const r=S.results.find(x=>x.id===f.dataset.id);if(r)r.grade=String(v.grade).trim().slice(0,4);ui.edit=null;break}
    case'book':S.books=S.books.filter(b=>b.subject!==v.subject);S.books.push({id:uid(),subject:v.subject,title:v.title.trim(),isbn:(v.isbn||'').replace(/[^0-9Xx-]/g,''),chapter:(v.chapter||'').trim(),toc:''});ui.msg='Lehrwerk gespeichert.';ui.msgType='okn';break;
    case'chapter':{const b=S.books.find(x=>x.id===f.dataset.id);if(b)b.chapter=(v.chapter||'').trim();ui.msg='Aktuelle Lektion gespeichert.';ui.msgType='okn';break}
    case'appt':
      if(toMin(v.end)<=toMin(v.start)){ui.msg='Das Ende muss nach dem Beginn liegen.';ui.msgType='err';break}
      if(v.when==='once'){if(!v.date){ui.msg='Für einen einmaligen Termin bitte ein Datum angeben.';ui.msgType='err';break}S.oneoffs.push({id:uid(),title:v.title,date:v.date,start:v.start,end:v.end})}
      else S.appts.push({id:uid(),title:v.title,weekday:+v.when.slice(1),start:v.start,end:v.end});
      ui.msg='Termin gespeichert.';break;
    case'settings':{
      const st=Object.assign({},S.settings),se=Object.assign({},S.schoolEnd);
      st.afterSchool=+v.afterSchool||0;st.latest=v.latest||st.latest;st.weekendStart=v.weekendStart||st.weekendStart;
      st.buffer=+v.buffer||0;st.blockMax=Math.max(10,+v.blockMax||15);st.pause=+v.pause||0;st.sundayFree=!!v.sundayFree;st.holidaysFree=!!v.holidaysFree;
      st.ludusOn=!!v.ludusOn;st.ludusMin=Math.max(5,+v.ludusMin||15);st.ludusUrl=(v.ludusUrl||'').trim();
      st.checksOn=!!v.checksOn;st.winGoal=Math.min(5,Math.max(1,+v.winGoal||4));st.bedtimeMin=Math.max(5,+v.bedtimeMin||30);
      if(v.pin&&v.pin.trim())st.pin=v.pin.trim();
      if(v.kidId!==undefined)st.kidId=v.kidId;
      if(REMOTE)st.pushOn=!!v.pushOn;
      S.settings=st;S.schoolEnd=se;S.meta=Object.assign({},S.meta,{setup:true});
      ui.msg='Einstellungen gespeichert.';ui.msgType='okn';break}
  }
  save();render();
});

document.addEventListener('change',e=>{
  const el=e.target;
  if(el.matches&&el.matches('select[data-tt]')){
    const tt=S.timetable;if(!tt)return;const t=ui.ttType||weekType(today()),wd=ui.ttDay||1,i=+el.dataset.tt;
    const plan=Object.assign({},tt[t]),l=(plan[wd]||[]).slice();while(l.length<=i)l.push('');l[i]=el.value;while(l.length&&!l[l.length-1])l.pop();
    plan[wd]=l;tt[t]=plan;save();render();return;
  }
  if(el.matches&&el.matches('select[data-due]')){const f=el.closest('form'),d=f&&f.querySelector('input[name=due]');if(d)d.value=nextLesson(el.value)}
});

setInterval(()=>{document.querySelectorAll('[data-elapsed]').forEach(el=>el.textContent=Math.round((Date.now()-+el.dataset.elapsed)/60000))},15000);

/* ===== Start ===== */
async function init(){
  const cached=readCache();
  S=cached||(REMOTE?defaults():seed());
  render();
  if(!REMOTE){save();return}
  try{
    if(!window.supabase)await new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';sc.onload=res;sc.onerror=rej;document.head.append(sc)});
    sb=window.supabase.createClient(FCFG.supabaseUrl,FCFG.supabaseKey);
    const{data}=await sb.auth.getSession();
    if(!data||!data.session){authOk=false;if(!cached){document.getElementById('app').innerHTML='<div class="card"><h2>Bitte zuerst anmelden</h2><div class="sub">Der Lernplaner nutzt die Anmeldung des Familienplans. Öffne zuerst den Familienplan auf diesem Gerät und melde dich an.</div><div class="row" style="margin-top:12px"><a class="btn primary" href="index.html">Zum Familienplan</a></div></div>';return}}
  }catch(e){ui.sync='err';console.warn(e)}
  if(sb&&authOk){
    try{await pull(true,!cached)}catch(e){ui.sync='err';console.warn(e)}
    try{const{data}=await sb.from('ep_persons').select('id,name,adult').order('sort');kids=(data||[]).filter(p=>!p.adult)}catch(e){}
  }
  render();push();
  const refresh=async()=>{if(ui.fb||ui.edit||document.activeElement&&/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))return;
    try{if(await pull(false))render();else syncDot()}catch(e){ui.sync='err';syncDot()}};
  setInterval(refresh,45000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refresh()});
}
init();
</script>
